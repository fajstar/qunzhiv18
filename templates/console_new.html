    function dimAt(px, py) {
      if (dimAll > 0.995) return 1;
      var dd = Math.sqrt((px - dimCenter.x) * (px - dimCenter.x) +
                         (py - dimCenter.y) * (py - dimCenter.y));
      var fall = Math.pow(Math.max(0, 1 - dd / dimR), 1.6);
      return dimAll + (1 - dimAll) * fall;
    }

    ctx.clearRect(0, 0, W, H);
    var bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.62);
    bg.addColorStop(0, "rgba(29,78,216,0.055)");
    bg.addColorStop(0.45, "rgba(29,78,216,0.028)");
    bg.addColorStop(1, "rgba(247,243,238,0)");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    /* ============ 第一幕：漂浮 + 弱涟漪 ============ */
    if (S === "ask") {
      var rp = (el % 3200) / 3200;
      var rrad = rp * Math.max(W, H) * 0.62;
      var ra = (1 - rp) * 0.10;
      var g0 = ctx.createRadialGradient(CX, CY, Math.max(0, rrad - 42), CX, CY, rrad + 42);
      g0.addColorStop(0.0, "rgba(29,78,216,0)");
      g0.addColorStop(0.5, "rgba(29,78,216," + ra.toFixed(3) + ")");
      g0.addColorStop(1.0, "rgba(29,78,216,0)");
      ctx.fillStyle = g0; ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = "source-over";
      for (var i = 0; i < P.length; i++) {
        var p = P[i];
        var br = Math.sin(el * 0.0009 + p.ph) * 0.07;
        var px = p.fx + br + mouse.x * 0.12 * (1 + p.fz);
        var py = p.fy + br * 0.7 + mouse.y * 0.12 * (1 + p.fz);
        var pr = project(px, py, p.fz, rotY * 0.3, rotX * 0.3);
        var dcent = Math.sqrt(px * px + py * py) * R;
        var near = Math.abs(dcent - rrad) < 46 ? (1 - Math.abs(dcent - rrad) / 46) * 0.5 : 0;
        var a = 0.16 + 0.16 * (0.5 + 0.5 * Math.sin(el * 0.0012 + p.ph)) + near;
        ctx.fillStyle = "rgba(29,78,216," + Math.min(0.95, a).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(pr.x, pr.y, Math.max(0.5, p.r * pr.s * 0.85), 0, 6.2832); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      requestAnimationFrame(frame);
      return;
    }

    /* ============ 第二幕起 ============ */
    var el2 = since(tGather) / 1000;
    var waveR = el2 * RIPPLE_SPEED;
    var allDone = true;

    // ② 第三幕：极狠的骨架剪影（总监：剪影要有，但要更狠更淡）
    //    α ≤0.055、去饱和到近黑蓝、节点只留 4 个 1px 十字刻度
    if (S === "freeze" && dimAll < 0.95) {
      var sk = (1 - dimAll);
      ctx.lineWidth = 1;
      for (var e5 = 0; e5 < edges.length; e5++) {
        if (e5 === keyEdge) continue;
        var sA = project(pts[edges[e5][0]].x, pts[edges[e5][0]].y, pts[edges[e5][0]].z, rotY, rotX);
        var sB = project(pts[edges[e5][1]].x, pts[edges[e5][1]].y, pts[edges[e5][1]].z, rotY, rotX);
        ctx.strokeStyle = "rgba(52,52,62," + (0.11 * sk * Math.min(sA.s, sB.s) * 2).toFixed(3) + ")";
        ctx.beginPath(); ctx.moveTo(sA.x, sA.y); ctx.lineTo(sB.x, sB.y); ctx.stroke();
      }
      var tickIdx = [3, 29, 61, 97];
      ctx.strokeStyle = "rgba(74,74,86," + (0.36 * sk).toFixed(3) + ")";
      for (var t6 = 0; t6 < tickIdx.length; t6++) {
        var vv = pts[tickIdx[t6]];
        var vp6 = project(vv.x, vv.y, vv.z, rotY, rotX);
        ctx.beginPath();
        ctx.moveTo(vp6.x - 3, vp6.y); ctx.lineTo(vp6.x + 3, vp6.y);
        ctx.moveTo(vp6.x, vp6.y - 3); ctx.lineTo(vp6.x, vp6.y + 3);
        ctx.stroke();
      }
    }

    // 棱（跳过关键边）
    for (var e = 0; e < edges.length; e++) {
      if (e === keyEdge) continue;
      var A = edges[e][0], B = edges[e][1];
      var pa0 = pts[A], pb0 = pts[B];
      var dA = Math.sqrt(pa0.x * pa0.x + pa0.y * pa0.y + pa0.z * pa0.z);
      var dB = Math.sqrt(pb0.x * pb0.x + pb0.y * pb0.y + pb0.z * pb0.z);
      var tA = (dA / RIPPLE_SPEED) + 0.20 + 0.90;
      var tB = (dB / RIPPLE_SPEED) + 0.20 + 0.90;
      var lit = Math.min(1, Math.max(0, (el2 - Math.max(tA, tB)) / 0.35));
      if (lit <= 0) { allDone = false; continue; }
      var pa = project(pa0.x, pa0.y, pa0.z, rotY, rotX);
      var pb = project(pb0.x, pb0.y, pb0.z, rotY, rotX);
      var dAmp = 0.16 * lit * Math.min(pa.s, pb.s) * dimAt((pa.x + pb.x) / 2, (pa.y + pb.y) / 2);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(29,78,216," + dAmp.toFixed(3) + ")";
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    }

    // 粒子
    ctx.globalCompositeOperation = "source-over";
    for (var m = 0; m < P.length; m++) {
      var pp = P[m];
      var d = Math.sqrt(pp.tx * pp.tx + pp.ty * pp.ty + pp.tz * pp.tz) || 0.001;
      var wake = d / RIPPLE_SPEED;
      var t = (el2 - wake - pp.lag) / pp.dur;
      if (t < 0) t = 0; if (t > 1) t = 1;
      if (t < 1) allDone = false;

      var sinceWake = el2 - wake;
      if (sinceWake > 0 && sinceWake < 0.25) pp.flash = (1 - sinceWake / 0.25) * 0.9;
      else if (pp.flash > 0) pp.flash *= 0.88;

      // ⑤ 缓动插值（quad ↔ cubic）
      var raw = pp.cubic ? easeInCubic(t) : easeInQuad(t);
      var k = t < 1 ? raw : 1;
      // ⑤ 犹豫回摆：到位前 0.3s 反向偏一点
      var wob = 0;
      if (pp.wobble && t > 0.72 && t < 0.95) {
        wob = Math.sin((t - 0.72) / 0.23 * Math.PI) * 0.05;
      }
      var it = 1 - k;
      var x = it * it * pp.sx + 2 * it * k * pp.cx + k * k * pp.tx;
      var y = it * it * pp.sy + 2 * it * k * pp.cy + k * k * pp.ty;
      var z = pp.sz + (pp.tz - pp.sz) * k;
      // 临界"剥离"：整体外扩 8%
      var expand = 1 + 0.08 * (1 - dimAll);
      x *= expand; y *= expand; z *= expand;
      x += wob * (pp.tx - pp.sx); y += wob * (pp.ty - pp.sy);

      var pj = project(x, y, z, rotY, rotX);
      var depth = Math.max(0.35, Math.min(1, (1.6 - pj.z) / 2.4));
      var localDim = dimAt(pj.x, pj.y);
      if (pp.wobble && t > 0.40) localDim *= 0.6;
      // 保留锐利细核（不用 sprite，避免软糊光晕）；亮度分层靠 depth 与 alpha
      var alphaBreath = 0.88 + 0.12 * Math.sin(now() * 0.0018 + pp.ph * 3);
      var a2 = (0.20 + 0.80 * k) * depth * localDim * alphaBreath;
      // ③ 拆解亮度波：一圈往外扫的亮斑，读作"这个视角正在从课题里抽取信息"
      if (S === "gather" && decompCount > 0) {
        var dp = (now() - decompPulse) / 1000;
        if (dp < 0.85) {
          var dd3 = Math.sqrt(x * x + y * y + z * z);
          var waveFront = dp * 2.9;
          var dGap = Math.abs(dd3 - waveFront);
          if (dGap < 0.30) {
            a2 *= (1 + (1 - dGap / 0.30) * (1 - dp / 0.85) * 2.2);
          }
        }
      }
      var col = pp.warm ? WARM : BLUE;
      ctx.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' +
                      Math.min(1, a2).toFixed(3) + ')';
      var rad = Math.max(0.6, pp.r * pj.s);
      ctx.beginPath(); ctx.arc(pj.x, pj.y, rad, 0, 6.2832); ctx.fill();

      // ③ 运动拖尾：汇聚中段（0.15<t<0.9）画一小段尾迹，增加生命感
      if (t > 0.15 && t < 0.90) {
        var tPrev = Math.max(0, t - 0.045);
        var kPrev = pp.cubic ? easeInCubic(tPrev) : easeInQuad(tPrev);
        var itp = 1 - kPrev;
        var px2 = itp * itp * pp.sx + 2 * itp * kPrev * pp.cx + kPrev * kPrev * pp.tx;
        var py2 = itp * itp * pp.sy + 2 * itp * kPrev * pp.cy + kPrev * kPrev * pp.ty;
        var pz2 = pp.sz + (pp.tz - pp.sz) * kPrev;
        var pp2 = project(px2, py2, pz2, rotY, rotX);
        ctx.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' +
                          (Math.min(1, a2) * 0.32).toFixed(3) + ')';
        ctx.lineWidth = Math.max(0.5, rad * 0.75);
        ctx.beginPath(); ctx.moveTo(pp2.x, pp2.y); ctx.lineTo(pj.x, pj.y); ctx.stroke();
      }
      if (pp.flash > 0.02 && dimAll > 0.8) {
        ctx.fillStyle = "rgba(190,215,255," + (pp.flash * 0.55 * dimAt(pj.x, pj.y)).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(pj.x, pj.y, rad * 4.2, 0, 6.2832); ctx.fill();
      }
      if (t > 0.97) {
        // 抖动粒子带独立呼吸（第 2/4 幕也持续）
        var breathe = (pp.r > 1.55) ? (0.85 + 0.15 * Math.sin(now() * 0.0022 + pp.ph)) : 1;
        ctx.fillStyle = pp.warm
          ? "rgba(255,248,240," + (0.08 * localDim * breathe).toFixed(3) + ")"
          : "rgba(29,78,216," + (0.09 * localDim * breathe).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(pj.x, pj.y, rad * 3.2, 0, 6.2832); ctx.fill();
      }
    }

    // ① 只用**一条橙红虚线**表达"还没接上的边"——不画一堆点（点串像噪点，线才像边）
    if ((S === "gather" || S === "freeze") && keyEdge >= 0) {
      var gA7 = pts[keyA], gB7 = pts[keyB];
      var p7a = project(gA7.x, gA7.y, gA7.z, rotY, rotX);
      var p7b = project(gB7.x, gB7.y, gB7.z, rotY, rotX);
      var al7 = (S === "gather")
        ? Math.min(1, Math.max(0, (el2 - 0.55) / 0.6)) * 0.42
        : 0.55;
      if (al7 > 0.01) {
        // 外发光
        ctx.strokeStyle = "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + "," + (al7 * 0.28).toFixed(3) + ")";
        ctx.lineWidth = 4.5;
        ctx.setLineDash([4, 8]);
        ctx.beginPath(); ctx.moveTo(p7a.x, p7a.y); ctx.lineTo(p7b.x, p7b.y); ctx.stroke();
        // 主线
        ctx.strokeStyle = "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + "," + al7.toFixed(3) + ")";
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(p7a.x, p7a.y); ctx.lineTo(p7b.x, p7b.y); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // 异色粒子：用户的问题（意见 4）——它们飞向关键边两端并常驻
    for (var q = 0; q < ACC.length; q++) {
      var ac = ACC[q];
      var at = (el2 - ac.delay) / ac.dur;
      if (at < 0) at = 0; if (at > 1) at = 1;
      var ak = easeOutCubic(at);
      var ax = ac.sx + (ac.tx - ac.sx) * ak;
      var ay = ac.sy + (ac.ty - ac.sy) * ak;
      var az = ac.sz + (ac.tz - ac.sz) * ak;
      var ap = project(ax, ay, az, rotY, rotX);
      // ① 飞行过程中才画（at<0.92）；落位后交给那条虚线，不再留点
      if (at > 0.92) continue;
      var aa = (0.35 + 0.65 * ak) * (0.55 + 0.45 * dimAll) * 0.85;
      var ar = Math.max(0.62, 0.78 * ap.s);
      ctx.fillStyle = "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + "," + aa.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(ap.x, ap.y, ar, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + "," + (aa * 0.07).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(ap.x, ap.y, ar * 1.6, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    // ★ 6 条扇形引导线：与 6 张视角卡同步点亮，把「6 个视角」这件事画出来
    if (S === "gather" || S === "freeze") {
      var lit6 = Math.min(1, Math.max(0, (el2 * 1000 - 700) / 900));
      if (lit6 > 0.01) {
        ctx.save();
        ctx.lineWidth = 1;
        for (var a6 = 0; a6 < 6; a6++) {
          // 每条的亮度按"该卡已点亮"逐条跟上
          var order = Math.min(1, Math.max(0, (el2 * 1000 - 700 - a6 * 820) / 620));
          if (order <= 0) continue;
          var ang6 = (-Math.PI / 2) + a6 * (Math.PI * 2 / 6);
          var ge = R * cam.zoom * 0.94;
          var gx1 = CX + cam.shiftX + Math.cos(ang6) * R * cam.zoom * 0.18;
          var gy1 = CY + Math.sin(ang6) * R * cam.zoom * 0.18;
          var gx2 = CX + cam.shiftX + Math.cos(ang6) * ge;
          var gy2 = CY + Math.sin(ang6) * ge;
          var gg = ctx.createLinearGradient(gx1, gy1, gx2, gy2);
          var al = order * 0.11 * (S === "freeze" ? (0.4 + 0.6 * dimAll) : 1);
          gg.addColorStop(0, "rgba(120,175,255," + (al * 1.4).toFixed(3) + ")");
          gg.addColorStop(0.55, "rgba(90,150,255," + (al * 0.7).toFixed(3) + ")");
          gg.addColorStop(1, "rgba(29,78,216,0)");
          ctx.strokeStyle = gg;
          ctx.beginPath(); ctx.moveTo(gx1, gy1); ctx.lineTo(gx2, gy2); ctx.stroke();
          // 外端的极淡刻度点
          ctx.fillStyle = "rgba(150,195,255," + (al * 2.2).toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(gx2, gy2, 1.8 * cam.zoom, 0, 6.2832); ctx.fill();
        }
        ctx.restore();
      }
    }

    // 汇聚涟漪可视化
    if (S === "gather") {
      var wr = Math.min(waveR, 3.2) * R * cam.zoom;
      var wg = ctx.createRadialGradient(CX + cam.shiftX, CY, Math.max(0, wr - 30),
                                        CX + cam.shiftX, CY, wr + 30);
      wg.addColorStop(0, "rgba(90,150,255,0)");
      wg.addColorStop(0.5, "rgba(120,175,255,0.10)");
      wg.addColorStop(1, "rgba(29,78,216,0)");
      ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);
    }

    // 六视角依次点亮
    if (S === "gather") {
      var want = Math.min(AGENTS.length, Math.floor(Math.max(0, el2 * 1000 - 700) / 820));
      while (agentsShown < want) {
        (function (idx) {
          var elx = document.getElementById("ag" + idx);
          if (elx) setTimeout(function () { elx.classList.add("on"); }, 20);
        })(agentsShown);
        agentsShown++;
        decompPulse = now();      // ③ 每点亮一张卡，就发一圈亮度波
        decompCount++;
      }
      if (allDone && el2 > 5.9) goScene("freeze");
    }

    /* ============ 第三幕：临界停顿 0.9s（剥离式压暗 + 横移把缺口送到黄金分割位） ============ */
    if (S === "freeze" || S === "emerge") {
      var fe = since(tFreeze) / 1000;
      // 剥离：0→0.35s 压暗到 0.35；之后按脉动微调
      var target = 0.35 + 0.10 * Math.sin(fe * (2 * Math.PI / 0.30)) * (S === "freeze" ? 1 : 0);
      if (S === "freeze") {
        var pz = Math.min(1, fe / 0.35);
        dimAll = 1 - (1 - target) * easeOutCubic(pz);
      }
      // 关键边：虚线 + 两端满亮
      if (S === "freeze" && keyEdge >= 0) {
        var A2 = pts[keyA], B2 = pts[keyB];
        var qa = project(A2.x, A2.y, A2.z, rotY, rotX);
        var qb = project(B2.x, B2.y, B2.z, rotY, rotX);
        var phase = (fe % 0.60) / 0.60;                 // 0.6s 一个呼吸周期（两端反相）
        var phA = 0.55 + 0.45 * Math.sin(phase * Math.PI * 2);
        var phB = 0.55 + 0.45 * Math.sin(phase * Math.PI * 2 + Math.PI);
        // ③ 把「等待」变成可读的进度：虚线沿线段生长（0 → 100%），恰好 0.9s 接上
        var prog = Math.min(1, fe / (FREEZE_MS / 1000));
        var segLen = Math.sqrt((qb.x - qa.x) * (qb.x - qa.x) + (qb.y - qa.y) * (qb.y - qa.y));
        var ex = qa.x + (qb.x - qa.x) * prog;
        var ey = qa.y + (qb.y - qa.y) * prog;
        ctx.save();
        ctx.setLineDash([5, 7]);
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = "rgba(255,150,110," + (0.55 + 0.45 * prog).toFixed(3) + ")";
        ctx.beginPath(); ctx.moveTo(qa.x, qa.y); ctx.lineTo(ex, ey); ctx.stroke();
        // 生长端点的亮点
        ctx.globalCompositeOperation = "source-over";
        var tipG = ctx.createRadialGradient(ex, ey, 0, ex, ey, 14);
        tipG.addColorStop(0, "rgba(255,180,140," + (0.6 + 0.4 * prog).toFixed(3) + ")");
        tipG.addColorStop(1, "rgba(255,122,69,0)");
        ctx.fillStyle = tipG; ctx.beginPath(); ctx.arc(ex, ey, 14, 0, 6.2832); ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.restore();
        ctx.globalCompositeOperation = "source-over";
        [[qa, phA], [qb, phB]].forEach(function (pair) {
          var q1 = pair[0], ph = pair[1];
          var gr = ctx.createRadialGradient(q1.x, q1.y, 0, q1.x, q1.y, 30);
          gr.addColorStop(0, "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + "," + (ph * 0.85).toFixed(3) + ")");
          gr.addColorStop(1, "rgba(140,185,255,0)");
          ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(q1.x, q1.y, 30, 0, 6.2832); ctx.fill();
        });
        ctx.globalCompositeOperation = "source-over";
        // ③ 末帧静帧 60ms（让爆发点更干脆）
        if (fe > FREEZE_MS / 1000 + 0.06) goScene("emerge");
      }
    }

    /* ============ 第四幕：合拢 + 脉冲 + 后坐 ============ */
    if (S === "emerge" || S === "enter") {
      if (pulse < 0) {
        pulse = now();
        dimAll = 1;
        cam.zoomV = 0.055;                 // 推进一拍
        if (keyEdge >= 0) {
          var A3 = pts[keyA], B3 = pts[keyB];
          var qa3 = project(A3.x, A3.y, A3.z, rotY, rotX);
          var qb3 = project(B3.x, B3.y, B3.z, rotY, rotX);
          ctx.strokeStyle = "rgba(" + ACCENT[0] + "," + ACCENT[1] + "," + ACCENT[2] + ",0.98)";
          ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.moveTo(qa3.x, qa3.y); ctx.lineTo(qb3.x, qb3.y); ctx.stroke();
        }
      }
      var pe = (now() - pulse) / 1000;
      var glow = Math.max(0, 1 - pe / 0.90);
      if (glow > 0.01) {
        ctx.globalCompositeOperation = "source-over";
        for (var q2 = 0; q2 < pts.length; q2++) {
          var v = pts[q2];
          var vp = project(v.x, v.y, v.z, rotY, rotX);
          ctx.fillStyle = "rgba(255,248,240," + (glow * 0.55).toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(vp.x, vp.y, 3.2 * vp.s, 0, 6.2832); ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
      }
      var bt = pe / 1.60;
      if (bt < 1) {
        var brr = R * cam.zoom * (0.5 + bt * 2.8);
        var ba = (1 - bt) * 0.45;
        var g2 = ctx.createRadialGradient(CX + cam.shiftX, CY, brr * 0.52,
                                          CX + cam.shiftX, CY, brr);
        g2.addColorStop(0, "rgba(29,78,216,0)");
        g2.addColorStop(0.70, "rgba(125,180,255," + (ba * 0.85).toFixed(3) + ")");
        g2.addColorStop(1, "rgba(29,78,216,0)");
        ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
      }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------------- 场景切换 ---------------- */
  function goScene(s) {
    if (s === "gather") {
      S = "gather"; tGather = now();
      show("qz-intro-s1", false); show("qz-intro-s2", true);
      spawnFly();
      cam.zoomT = 1.12;                    // 意见 2①：汇聚推镜
    } else if (s === "freeze") {
      S = "freeze"; tFreeze = now();
      // 意见 2②：横移，把缺口中点送到黄金分割线（0.382W）
      var rotY = 0, rotX = 0;
      var A = pts[keyA], B = pts[keyB];
      var mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, mz = (A.z + B.z) / 2;
      var mp = project(mx, my, mz, rotY, rotX);
      // ① 就近平移（±0.12W）+ **0.025 rad 朝缺口方向的微 yaw**
      //    不是「追黄金分割」，只是让镜头「向那条边靠过去」
      var needX = (W * 0.382) - mp.x;
      var maxX = W * 0.12;
      cam.shiftXT = Math.max(-maxX, Math.min(maxX, needX));
      cam.yawT = (needX >= 0 ? 1 : -1) * 0.025;
    } else if (s === "emerge") {
      S = "emerge"; tEmerge = now();
      show("qz-intro-s2", false); show("qz-intro-s3", true);
      cam.zoomT = 1.0;
      cam.shiftXT = 0;
      cam.yawT = 0;
    } else if (s === "enter") {
      S = "enter"; show("qz-intro-s4", true);
      // ① 标题整层上移，与按钮分离
      var s3 = document.getElementById("qz-intro-s3");
      if (s3) s3.classList.add("qz-up");
    }
  }

  /* ---------------- 用户文字 → 异色粒子 → 关键边两端 ---------------- */
  function spawnFly() {
    var host = document.getElementById("qz-intro-fly");
    var box = document.getElementById("qz-in");
    if (!host || !box) return;
    var r = box.getBoundingClientRect();
    var txt = (TOPIC || "你的问题").slice(0, 14);
    host.innerHTML = "";
    var W2 = window.innerWidth, H2 = window.innerHeight;
    var bx = r.left + r.width / 2, by = r.top + r.height / 2;
    for (var i = 0; i < txt.length; i++) {
      var d = document.createElement("span");
      d.textContent = txt[i];
      // 起始位置：沿输入框横向铺开
      var u = txt.length <= 1 ? 0 : (i / (txt.length - 1) - 0.5);
      d.style.left = (bx + u * r.width * 0.86) + "px";
      d.style.top = by + "px";
      d.style.color = "rgba(255,240,225,.95)";
      // ① 发散方向：以上方为主的扇形（-150° ~ -30°），越靠边角度越大
      var ang = (-Math.PI / 2) + u * (Math.PI * 0.62);
      var dist = 150 + Math.random() * 170;
      d.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
      d.style.setProperty("--dy", (Math.sin(ang) * dist - 30).toFixed(1) + "px");
      d.style.animationDelay = (i * 26) + "ms";
      host.appendChild(d);
    }
    // ② 停留时长缩短：进入临界停顿时它已经散了
    setTimeout(function () { host.innerHTML = ""; }, 980);

    // 异色粒子：从输入框位置飞向关键边两端（意见 4）
    ACC = [];
    var sxw = (r.left + r.width / 2 - CX) / (R * 1.12);
    var syw = (r.top + r.height / 2 - CY) / (R * 1.12);
    // ① 异色粒子**沿关键边均匀排开**——不是堆在两端，而是串成那条边
    var A0 = pts[keyA], B0 = pts[keyB];
    // ① 数量加倍、间距均匀 —— 让它读成"一条虚线边"，而不是"一坨团"
    var n = Math.max(18, Math.min(34, txt.length * 3));
    for (var k = 0; k < n; k++) {
      var u = (k + 0.5) / n;                         // 0→1 沿边
      var jx = (Math.random() - 0.5) * 0.018;        // 极小抖动，保持"线"的感觉
      var jy = (Math.random() - 0.5) * 0.018;
      ACC.push({
        sx: sxw + (Math.random() - 0.5) * 0.20,
        sy: syw + (Math.random() - 0.5) * 0.10,
        sz: 0.2,
        tx: A0.x + (B0.x - A0.x) * u + jx,
        ty: A0.y + (B0.y - A0.y) * u + jy,
        tz: A0.z + (B0.z - A0.z) * u,
        delay: 0.06 + u * 0.55,                      // 沿边依次亮起
        dur: 0.80,
        u: u
      });
    }
  }

  /* ---------------- 第一幕输入 ---------------- */
  var inp = document.getElementById("qz-in");
  var go = document.getElementById("qz-go");
  var samples = document.getElementById("qz-samples");
  SAMPLES.forEach(function (s) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = s;
    b.onclick = function (e) { e.stopPropagation(); inp.value = s; inp.focus(); };
    samples.appendChild(b);
  });

    if (e.key === "Enter") { e.preventDefault(); submit(); }
    e.stopPropagation();
  });
  inp.addEventListener("click", function (e) { e.stopPropagation(); });
  function submit() {
    if (S !== "ask") return;
    TOPIC = (inp.value || "").trim();
    if (!TOPIC) { nudge(); return; }
    goScene("gather");
  }
  go.addEventListener("click", function (e) { e.stopPropagation(); submit(); });

  var host = document.getElementById("qz-agents");
  AGENTS.forEach(function (a, i) {
    var d = document.createElement("div");
    d.className = "qz-agent"; d.id = "ag" + i;
    d.innerHTML = '<i>' + (i + 1) + '</i>'
      + '<b>' + a.n + '</b>'
      + '<em class="kv kv-' + (a.k || 'info') + '">' + a.v + '</em>'
      + '<span>' + a.d + '</span>';
    host.appendChild(d);
  });

  /* ---------------- 第四幕：用户主动进入 ---------------- */
  var enterBtn = document.getElementById("qz-enter");
  if (enterBtn) enterBtn.addEventListener("click", function (e) { e.stopPropagation(); enter(); });
  function enter() {
    if (S !== "enter") return;
    try {
      var ti = document.getElementById("topicInput");
      if (ti && TOPIC) {
        ti.value = TOPIC;
        ti.dispatchEvent(new Event("input", { bubbles: true }));
      }
    } catch (er) {}
    close();
  }
  var waitEnter = setInterval(function () {
    if (S === "emerge" && since(tEmerge) > 3400) { clearInterval(waitEnter); goScene("enter"); }
    if (S === "enter" || S === "done") clearInterval(waitEnter);
  }, 120);

  document.addEventListener("mousemove", function (e) {
    mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  var closed = false;
  function close() {
    if (closed) return; closed = true; S = "done";
    ov.classList.add("qz-intro-out");
    setTimeout(function () {
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      window.removeEventListener("resize", resize);
    }, 520);
  }
  function skip() {
    try {
      var ti = document.getElementById("topicInput");
      if (ti && TOPIC && !ti.value) ti.value = TOPIC;
    } catch (e) {}
    close();
  }
  var skipBtn = document.getElementById("qz-skip");
  if (skipBtn) skipBtn.addEventListener("click", function (e) { e.stopPropagation(); skip(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); skip(); }
  });
  var never = document.getElementById("qz-never");
  if (never) {
    never.addEventListener("click", function (e) {
      e.stopPropagation();
      try { localStorage.setItem(KEY_OFF, "1"); } catch (er) {}
      skip();
    });
  }
})();

<script>/* qz-bgm-ctl */
(function(){
  /* ===== [patch] ?bgm=0.6 可调背景音乐音量（录屏用） ===== */
var QZ_BGM_VOL = (function(){
  try {
    var v = new URLSearchParams(location.search).get("bgm");
    if (v === null || v === "") return 0.28;
    var n = parseFloat(v);
    if (isNaN(n)) return 0.28;
    return Math.max(0, Math.min(1, n));
  } catch(e){ return 0.28; }
})();

var a = document.getElementById('qz-bgm');
  var b = document.getElementById('qz-sound');
  if (!a || !b) return;
  a.volume = 0; a.loop = true;
  var started = false, on = false, timer = null;

  function ramp(target, ms, done){
    if (timer) clearInterval(timer);
    var from = a.volume, t0 = Date.now();
    timer = setInterval(function(){
      var k = Math.min(1, (Date.now() - t0) / ms);
      a.volume = Math.max(0, Math.min(1, from + (target - from) * k));
      if (k >= 1){ clearInterval(timer); timer = null; if (done) done(); }
    }, 40);
  }

  function label(){
    b.textContent = on ? '♪ 声音 开' : '♪ 声音 关';
    b.classList.toggle('on', on);
  }

  function play(silentFail){
    a.volume = 0;                      /* 先置 0 再 play，避免起播瞬间以满音量"啪"一下 */
    var p = a.play();
    if (p && p.then){
      p.then(function(){
        ramp(QZ_BGM_VOL, 3200);
        on = true; started = true; label();
      }).catch(function(){
        on = false; started = false; label();
        if (!silentFail) {
          /* 用户主动点了按钮但还是被拦：至少把状态标对，下次交互会重试 */
        }
      });
    } else {
      ramp(QZ_BGM_VOL, 3200);
      on = true; started = true; label();
    }
  }
  function pause(){
    ramp(0, 1500, function(){
      try { a.pause(); } catch(e){}
    });
    on = false; label();
  }

  b.addEventListener('click', function(e){
    e.stopPropagation();
    if (on) pause(); else play();
  });

  // 首次交互才启动（浏览器策略）
  function unlock(){ start(); }
  function start(){
    if (started) return;
    started = true;
    document.removeEventListener('click', unlock, true);
    document.removeEventListener('keydown', unlock, true);
    play();
  }
  document.addEventListener('click', unlock, true);
  document.addEventListener('keydown', unlock, true);

  /* ---- 默认打开：加载后立刻尝试自动播放 ---- */
  function autoplay(){
    if (on) return;
    play(true);                        /* silentFail：被拦时静默回退到首次交互 */
  }
  setTimeout(autoplay, 400);           /* 等 DOM 与音频元数据就绪 */
  window.addEventListener('focus', function(){ if (!on) autoplay(); });
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && !on) autoplay();
  });

  // 离开开场 → 淡出
  setInterval(function(){
    var ov = document.getElementById('qz-intro');
    if (!ov || ov.classList.contains('qz-intro-out')){
      if (on) pause();
    }
  }, 700);

  label();
})();
</script><script>/* qz-sfx */
(function(){
  var AC = null, master = null, on = true, lastRipple = -1;
  var PERIOD = 3200;              /* 与动画里 (el % 3200) 保持一致 */

  function ctx(){
    if (AC) return AC;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 0.9;
      master.connect(AC.destination);
    } catch(e){ return null; }
    return AC;
  }

  /* 低频鼓：正弦从 120Hz 滑到 48Hz + 一小段噪声做鼓皮 */
  function drum(gain){
    var a = ctx(); if (!a || !on) return;
    var t = a.currentTime;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.085);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.5);

    // 鼓皮：极短带通噪声
    var n = a.createBufferSource();
    var buf = a.createBuffer(1, a.sampleRate * 0.06, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++){
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
    }
    n.buffer = buf;
    var bp = a.createBiquadFilter(), ng = a.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 180; bp.Q.value = 1.2;
    ng.gain.value = gain * 0.55;
    n.connect(bp); bp.connect(ng); ng.connect(master);
    n.start(t);
  }

  /* 交互 tick：很短的高频点，几乎听不见，只给「按到了」的触感 */
  function tick(freq, gain, dur){
    var a = ctx(); if (!a || !on) return;
    var t = a.currentTime;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = freq || 2600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.045, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.09));
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + (dur || 0.09) + 0.02);
  }

  /* 按钮：短促的双音上行，比单纯 tick 更像「确认」 */
  function click(){
    var a = ctx(); if (!a || !on) return;
    tick(1900, 0.035, 0.07);
    setTimeout(function(){ tick(2850, 0.026, 0.08); }, 42);
  }

  /* 卡片出现：很轻的 ping */
  function ping(){ tick(3400, 0.015, 0.16); }

  /* ---- 波纹鼓点：读动画时钟，检测 rp 回绕 ---- */
  function watchRipple(){
    var el = window.__qzEl;
    if (typeof el !== 'number'){ return; }
    var rp = (el % PERIOD) / PERIOD;
    if (lastRipple >= 0 && rp < lastRipple && (lastRipple - rp) > 0.5){
      drum(0.12);                 /* 波纹从中心出发 → 一记鼓 */
    }
    lastRipple = rp;
  }
  setInterval(watchRipple, 40);

  /* ---- 交互音效 ---- */
  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('#qz-sound')) return;          /* 静音按钮自身不响 */
    if (t.closest('button, .qz-samples button, #qz-go, #qz-enter, #qz-skip')){
      if (ctx() && AC.state === 'suspended') { try { AC.resume(); } catch(er){} }
      click();
    }
  }, true);

  /* 第二幕卡片依次亮起 → 每张一个 ping */
  var seen = {};
  setInterval(function(){
    var host = document.getElementById('qz-agents');
    if (!host) return;
    var cards = host.querySelectorAll('.qz-agent.on');
    for (var i = 0; i < cards.length; i++){
      if (!seen[cards[i].id]){ seen[cards[i].id] = 1; ping(); }
    }
  }, 260);

  /* 静音开关：与底声共用左下角那个按钮 */
  var btn = document.getElementById('qz-sound');
  if (btn){
    var mo = new MutationObserver(function(){
      on = btn.classList.contains('on');
    });
    mo.observe(btn, { attributes: true, attributeFilter: ['class'] });
    on = btn.classList.contains('on');
  }
})();
</script><script>/* qz-sfx2：打字 + 悬停 */
(function(){
  var AC = null, master = null;

  function ctx(){
    if (AC) return AC;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = 1.0;
      master.connect(AC.destination);
    } catch(e){ return null; }
    return AC;
  }
  function muted(){
    var b = document.getElementById('qz-sound');
    return !b || !b.classList.contains('on');
  }
  function ready(){
    if (muted()) return null;
    return ctx();
  }

  /* 短促的「哒」：正弦 + 一点带通噪声 */
  function tap(freq, gain, dur){
    var a = ready(); if (!a) return;
    var t = a.currentTime;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);

    var n = a.createBufferSource();
    var buf = a.createBuffer(1, Math.max(1, Math.floor(a.sampleRate * 0.02)), a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++){
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
    }
    n.buffer = buf;
    var bp = a.createBiquadFilter(), ng = a.createGain();
    bp.type = 'bandpass'; bp.frequency.value = freq * 1.6; bp.Q.value = 1.6;
    ng.gain.value = gain * 0.7;
    n.connect(bp); bp.connect(ng); ng.connect(master);
    n.start(t);
  }

  /* ---- ① 打字 ---- */
  var inp = document.getElementById('qz-in');
  if (inp){
    inp.addEventListener('input', function(){
      var base = 1750 * (0.88 + Math.random() * 0.24);   /* 音高 ±12% 随机 */
      tap(base, 0.018, 0.026);
    }, true);
  }

  /* ---- ② 开头：示例问题悬停 ---- */
  var hovered = '';

  document.addEventListener('mouseover', function(e){
    var el = e.target;
    if (!el || !el.closest) return;

    /* 示例 chip */
    var chip = el.closest('.qz-samples button');
    if (chip){
      if (hovered === chip.textContent) return;
      hovered = chip.textContent;
      tap(2100, 0.022, 0.05);
      return;
    }

    /* 结尾：进入按钮 */
    var enter = el.closest('#qz-enter, #qz-go');
    if (enter){
      if (hovered === '__enter__') return;
      hovered = '__enter__';
      tap(880,  0.030, 0.10);
      setTimeout(function(){ tap(1320, 0.022, 0.13); }, 55);
      return;
    }

    /* 离开上面的元素 → 允许下次再触发 */
    if (!el.closest('.qz-samples, #qz-enter, #qz-go')) hovered = '';
  }, true);

  /* 鼠标离开按钮 / chip 时清掉标记，下次悬停还能响 */
  document.addEventListener('mouseout', function(e){
    var el = e.target;
    if (!el || !el.closest) return;
    if (el.closest('.qz-samples button') || el.closest('#qz-enter, #qz-go')) hovered = '';
  }, true);
})();

<script>/* qz-ff-js */
(function(){
  var cv=null, c=null, dpr=1, W=0, H=0;
  var R_=Math.PI*2, N=130, ffs=[], seeded=false;
  var t0=0, activated=false, burstDone=false, last=0;
  var COUPLE_AT=3600, K_BEFORE=0.0, K_AFTER=5.0;
  var mx=-9999, my=-9999, mActive=false;
  var waves=[];                                  /* 点击脉冲 */

  window.addEventListener('mousemove', function(e){
    mx=e.clientX; my=e.clientY; mActive=true;
  }, {passive:true});
  window.addEventListener('mouseleave', function(){ mActive=false; mx=my=-9999; });

  window.addEventListener('click', function(e){
    if (!cv || !c) return;
    waves.push({x:e.clientX, y:e.clientY, t:performance.now()});
  }, true);

  function mount(){
    if (cv && cv.parentNode) return true;
    var ov=document.getElementById('qz-intro');
    if (!ov) return false;
    cv=document.createElement('canvas'); cv.id='qz-ff';
    ov.appendChild(cv); c=cv.getContext('2d');
    resize(); window.addEventListener('resize', resize);
    return true;
  }

  function resize(){
    if (!cv) return;
    var r=cv.getBoundingClientRect();
    dpr=Math.min(2, window.devicePixelRatio||1);
    W=Math.max(1, Math.floor(Math.max(r.width||0, window.innerWidth||0)));
    H=Math.max(1, Math.floor(Math.max(r.height||0, window.innerHeight||0)));
    cv.width=Math.floor(W*dpr); cv.height=Math.floor(H*dpr);
    if (c) c.setTransform(dpr,0,0,dpr,0,0);
    seeded=false;
  }

  function seed(){
    if (seeded) return;
    seeded=true; ffs=[];
    for (var i=0;i<N;i++){
      ffs.push({
        x:Math.random()*W, y:Math.random()*H,
        vx:(Math.random()-0.5)*0.22, vy:(Math.random()-0.5)*0.22,
        ph:Math.random()*R_, w:1.60+Math.random()*0.08,
        z:0.5+Math.random()*0.5,
        ang:Math.random()*Math.PI, spin:(Math.random()-0.5)*1.1
      });
    }
  }

  function frame(now){
    requestAnimationFrame(frame);
    var ov=document.getElementById('qz-intro');
    if (!ov) return;
    if (!cv || !cv.parentNode){ if (!mount()) return; }

    var s4=document.getElementById('qz-intro-s4');
    var active=!!(s4 && s4.classList.contains('qz-on'));
    if (!active){
      if (activated){ activated=false; cv.classList.remove('on'); if(c) c.clearRect(0,0,W,H); }
      return;
    }
    if (!activated){ activated=true; t0=now; last=now; burstDone=false; resize(); seed(); cv.classList.add('on'); }
    seed();
    if (W<40 || H<40) return;

    var el=now-t0;
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    if (c) c.clearRect(0,0,W,H);

    var sx=0, sy=0, ax=0, ay=0;
    for (var i=0;i<N;i++){
      sx+=Math.cos(ffs[i].ph); sy+=Math.sin(ffs[i].ph);
      ax+=Math.cos(2*ffs[i].ang); ay+=Math.sin(2*ffs[i].ang);
    }
    sx/=N; sy/=N;
    var Rv=Math.sqrt(sx*sx+sy*sy);
    var psi=Math.atan2(sy,sx);
    var meanAng=(ax===0&&ay===0)?0:Math.atan2(ay,ax)/2;
    var K=(el<COUPLE_AT)?K_BEFORE:K_AFTER;

    /* 处理点击脉冲：把附近萤火虫的相位往前推一点 → 局部同步闪光 */
    for (var wi=waves.length-1; wi>=0; wi--){
      var wv=waves[wi], age=(now-wv.t)/1000;
      if (age>1.2){ waves.splice(wi,1); continue; }
      var rr=age*420;
      for (var q=0;q<N;q++){
        var fq=ffs[q], ddx=fq.x-wv.x, ddy=fq.y-wv.y;
        var dd=Math.sqrt(ddx*ddx+ddy*ddy);
        if (Math.abs(dd-rr)<70) fq.ph += 0.12;
      }
    }

    var MOUSE_R=150, REPEL=26;
    for (var j=0;j<N;j++){
      var f=ffs[j];
      f.ph += (f.w + K*Rv*Math.sin(psi-f.ph))*dt;
      if (f.ph>R_) f.ph-=R_;

      /* ① 排斥力：鼠标靠近就惊飞 */
      if (mActive){
        var dx=f.x-mx, dy=f.y-my;
        var d2=dx*dx+dy*dy;
        if (d2 < MOUSE_R*MOUSE_R && d2 > 1){
          var d=Math.sqrt(d2);
          var force=(1-d/MOUSE_R)*REPEL;
          f.vx += (dx/d)*force*dt;
          f.vy += (dy/d)*force*dt;
        }
      }
      /* 阻尼：被推开后慢慢停住，再靠漂移回来 */
      f.vx*=0.965; f.vy*=0.965;
      var sp=Math.sqrt(f.vx*f.vx+f.vy*f.vy);
      if (sp>6){ f.vx=f.vx/sp*6; f.vy=f.vy/sp*6; }
      if (sp<0.06){ f.vx+=(Math.random()-0.5)*0.08; f.vy+=(Math.random()-0.5)*0.08; }

      f.x+=f.vx; f.y+=f.vy;
      if (f.x<-30) f.x=W+30; if (f.x>W+30) f.x=-30;
      if (f.y<-30) f.y=H+30; if (f.y>H+30) f.y=-30;

      /* 硬同步：锁定后把相位直接拉向群体平均相位 ψ */
      if (K>0){
        var dp=psi-f.ph;
        while (dp> Math.PI) dp-=R_;
        while (dp<-Math.PI) dp+=R_;
        f.ph += dp * 0.9 * dt;
        if (f.ph>R_) f.ph-=R_;
        if (f.ph<0)  f.ph+=R_;
      }

      if (K<=0){ f.ang+=f.spin*dt; }
      else {
        var dA=meanAng-f.ang;
        while (dA> Math.PI/2) dA-=Math.PI;
        while (dA<-Math.PI/2) dA+=Math.PI;
        f.ang += (f.spin*0.25 + dA*2.4)*dt;
      }
    }

    if (c){
      for (var k=0;k<N;k++){
        var g=ffs[k];
        var s=Math.sin(g.ph);
        var flash=s>0?Math.pow(s,11):0;

        /* ② 邻近提亮：鼠标周围 130px 内加亮 */
        var wake=0;
        if (mActive){
          var wdx=g.x-mx, wdy=g.y-my;
          var wd=Math.sqrt(wdx*wdx+wdy*wdy);
          if (wd<130) wake=(1-wd/130)*0.55;
        }

        /* 全局脉动：同步度高时，全场叠加一个统一的亮度呼吸 */
        var gcol = 0;
        if (Rv > 0.75){
          var sp2 = Math.sin(psi);
          gcol = (sp2 > 0 ? Math.pow(sp2, 8) : 0) * Math.min(1, (Rv - 0.75) * 4) * 0.55 * g.z;
        }

        var a=0.55*g.z + flash*0.9*g.z + wake + gcol;
        if (a<0.02) continue;

        var half=((9+flash*26)*g.z)/2;
        var ca=Math.cos(g.ang), sa=Math.sin(g.ang);
        var x1=g.x-ca*half, y1=g.y-sa*half;
        var x2=g.x+ca*half, y2=g.y+sa*half;

        if (flash>0.05){
          c.strokeStyle='rgba(180,130,50,'+(a*0.20).toFixed(3)+')';
          c.lineWidth=6.5*g.z; c.lineCap='round';
          c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
        }
        /* 深赭 → 闪时转亮金，对比更强 */
        c.strokeStyle='rgba('+Math.round(138+90*flash)+','
                    + Math.round(90+96*flash)+','
                    + Math.round(22+120*flash)+','+Math.min(1,a).toFixed(3)+')';
        c.lineWidth=(1.7+flash*0.9)*(0.85+0.3*g.z);
        c.lineCap='round';
        c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
      }

      /* 点击脉冲的可见环 */
      for (var vi=waves.length-1; vi>=0; vi--){
        var w2=waves[vi], age2=(now-w2.t)/1000;
        if (age2>1.2) continue;
        var rr2=age2*420, aa2=(1-age2/1.2)*0.30;
        if (rr2<1) continue;
        c.strokeStyle='rgba(200,150,70,'+aa2.toFixed(3)+')';
        c.lineWidth=1.6;
        c.beginPath(); c.arc(w2.x,w2.y,rr2,0,R_); c.stroke();
      }

      if (!burstDone && el>=COUPLE_AT && Rv>0.80){
        burstDone=true;
        var t1=now;
        (function shock(){
          var e=(performance.now()-t1)/700;
          if (e>=1 || !c) return;
          var rr3=Math.max(W,H)*0.72*Math.pow(e,0.62);
          var aa3=(1-e)*0.42;
          var g2=c.createRadialGradient(W/2,H/2,Math.max(0,rr3-60),W/2,H/2,Math.max(rr3+60,1));
          g2.addColorStop(0,'rgba(250,196,86,0)');
          g2.addColorStop(0.5,'rgba(250,196,86,'+aa3.toFixed(3)+')');
          g2.addColorStop(1,'rgba(250,196,86,0)');
          c.fillStyle=g2; c.fillRect(0,0,W,H);
          requestAnimationFrame(shock);
        })();
      }
    }
  }
  requestAnimationFrame(frame);
})();
</script>
