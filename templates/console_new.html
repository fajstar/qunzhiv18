<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群智 · 科研决策预演智能体</title>
<style>
:root {
  --primary:#2563EB; --primary-light:#DBEAFE; --accent:#0EA5E9;
  --bg:#FAF6F0; --card:#FFFFFF; --card2:#F5F0E8;
  --border:#EAE3D8; --text:#1F2937; --dim:#6B7280;
  --green:#059669; --warn:#D97706; --danger:#DC2626;
  --shadow:0 2px 8px rgba(31,41,55,.05);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--border); box-shadow:var(--shadow); }
.topbar h1 { font-size:18px; display:flex; align-items:center; gap:10px; color:var(--text); }
.topbar h1 .logo-img { width:30px; height:30px; border-radius:6px; object-fit:cover; }
.topbar h1 .logo { color:var(--primary); }
.badge { font-size:11px; background:var(--primary-light); color:var(--primary); padding:3px 10px; border-radius:14px; font-weight:600; }
.wrap { display:flex; min-height:calc(100vh - 57px); }
.sidebar { width:200px; background:var(--card); border-right:1px solid var(--border); padding:14px 10px; }
.nav-item { padding:10px 14px; border-radius:8px; margin-bottom:3px; cursor:pointer; color:var(--dim); font-size:13px; display:flex; align-items:center; gap:9px; transition:all .15s; line-height:1.35; }
/* ① 图标与文字垂直对齐：emoji 基线会偏上，给图标固定行高与宽度 */
.nav-item > em, .nav-item > span.ic { font-style:normal; display:inline-flex; align-items:center; justify-content:center; width:1.35em; height:1.35em; line-height:1; font-size:14px; flex:0 0 1.35em; }
.nav-item:hover { background:var(--card2); color:var(--primary); }
.nav-item.active { background:var(--primary-light); color:var(--primary); font-weight:700; }
.main { flex:1; padding:22px 26px; max-width:1100px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:var(--shadow); }
.card h3 { font-size:15px; color:var(--text); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.card h3 .ico { color:var(--primary); }
label { font-size:12px; color:var(--dim); display:block; margin-bottom:5px; }
input[type=text], textarea, select { width:100%; background:#fff; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; font-size:13px; outline:none; transition:border .15s; }
input:focus, textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light); }
textarea { min-height:50px; resize:vertical; }
.btn { background:var(--primary); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; }
.btn:hover { background:#1D4ED8; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-ghost { background:transparent; border:1px solid var(--border); color:var(--dim); }
.btn-ghost:hover { color:var(--primary); border-color:var(--primary); }
.row { display:flex; gap:16px; }
.col { flex:1; }
/* 团队 */
.team-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.member { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:12px; }
.member .m-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.member .avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; background:var(--primary-light); color:var(--primary); font-weight:700; }
.member .m-name { font-weight:700; font-size:13px; }
.member .m-sub { color:var(--dim); font-size:11px; }
.member .m-speech { margin-top:6px; font-size:12px; color:#374151; line-height:1.5; background:#fff; border:1px solid var(--border); border-radius:6px; padding:7px; min-height:44px; }
/* 日志流 */
.log-area { max-height:300px; overflow-y:auto; }
.log-item { padding:6px 10px; border-left:3px solid var(--border); margin-bottom:4px; font-size:12px; line-height:1.5; border-radius:0 6px 6px 0; }
.log-item.speech { border-left-color:var(--accent); background:var(--card2); }
.log-item.collision { border-left-color:#D97706; background:#FEF3E2; box-shadow:inset 0 0 0 1px rgba(217,119,6,.25); }
.log-item.system { border-left-color:var(--primary); color:var(--dim); }
.log-item.round { border-left-color:var(--warn); font-weight:700; color:var(--warn); }
.log-item.intervention { border-left-color:#B91C1C; color:#B91C1C; font-weight:600; }


/* ===== 定位声明（决策预演 ≠ 研究报告）===== */
.pos-box { margin-bottom:14px; padding:13px 15px; background:#F1F5F9;
  border-left:4px solid #64748B; border-radius:0 10px 10px 0; }
.pos-box .pt { font-size:13.5px; font-weight:800; color:#334155; margin-bottom:8px;
  letter-spacing:.2px; }
.pos-box .pi { font-size:12.5px; color:#475569; line-height:1.85; margin-top:5px; }
.pos-box .pi b { color:#1E293B; font-weight:700; }
.pos-box .pi em { font-style:normal; color:#B45309; font-weight:700; }

/* ===== 完整讨论报告（Markdown 渲染）===== */
.md-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:18px 22px; margin-bottom:14px; }
.md-head { display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--border); }
.md-head .t { font-size:14.5px; font-weight:800; color:var(--primary); display:flex; align-items:center; gap:8px; }
.md-head .b { font-size:12px; color:#1D4ED8; background:#EFF6FF; border:1px solid #BFDBFE;
  border-radius:6px; padding:4px 11px; cursor:pointer; font-weight:600; font-family:inherit; }
.md-body { font-size:13.5px; line-height:1.9; color:#1F2937; }
.md-body h1 { font-size:19px; font-weight:800; color:#111827; margin:4px 0 14px; line-height:1.5;
  padding-left:11px; border-left:4px solid var(--primary); }
.md-body h2 { font-size:16px; font-weight:800; color:#1D4ED8; margin:22px 0 10px; line-height:1.55;
  padding-bottom:6px; border-bottom:1px dashed #E3D9C8; }
.md-body h3 { font-size:14px; font-weight:700; color:#374151; margin:16px 0 8px; }
.md-body p { margin:0 0 11px; }
.md-body ul, .md-body ol { margin:6px 0 12px; padding-left:1.6em; }
.md-body li { margin-bottom:5px; line-height:1.85; }
.md-body li::marker { color:var(--primary); font-weight:700; }
.md-body blockquote { margin:10px 0; padding:9px 14px; background:#F8FAFC;
  border-left:3px solid #93C5FD; border-radius:0 7px 7px 0; color:#374151; }
.md-body code { background:#F1F5F9; border-radius:4px; padding:1px 5px;
  font-family:ui-monospace,Consolas,monospace; font-size:12.5px; color:#B91C1C; }
.md-body strong { color:#111827; font-weight:800; }
.md-body hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
.md-body .mdt { border-collapse:collapse; width:100%; margin:10px 0; font-size:12.5px; }
.md-body .mdt th, .md-body .mdt td { border:1px solid var(--border); padding:6px 9px; text-align:left; }
.md-body .mdt th { background:var(--card2); font-weight:700; }

/* ===== 评审 v6 面板 ===== */
.v6-wrap { border:1px solid var(--border); border-radius:12px; overflow:hidden; margin:14px 0; background:var(--card); }
.v6-head { padding:13px 18px; background:linear-gradient(135deg,#F5F3FF,#FAF8FF);
  border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; }
.v6-head .t { font-size:14.5px; font-weight:800; color:#5B21B6; display:flex; align-items:center; gap:8px; }
.v6-head .s { font-size:11.5px; color:#6B7280; }
.v6-body { padding:16px 18px; }
.v6-anchor { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:9px; margin-bottom:14px; }
.v6-anchor.ok { background:#ECFDF5; border:1px solid #A7F3D0; border-left:4px solid #059669; }
.v6-anchor.bad { background:#FEF2F2; border:1px solid #FECACA; border-left:4px solid #DC2626; }
.v6-anchor.warn { background:#FFFBEB; border:1px solid #FDE68A; border-left:4px solid #D97706; }
.v6-anchor .ic { font-size:17px; line-height:1.3; flex:0 0 auto; }
.v6-anchor .tx { font-size:12.8px; line-height:1.75; }
.v6-anchor .tx b { font-size:13.2px; }
.v6-sec { margin-bottom:16px; }
.v6-sec:last-child { margin-bottom:0; }
.v6-sec > .lb { font-size:12.5px; font-weight:800; color:#4B5563; letter-spacing:.05em;
  margin-bottom:9px; display:flex; align-items:center; gap:7px; }
.v6-dim { background:var(--card2); border:1px solid #E7DFD2; border-radius:9px;
  padding:11px 13px; margin-bottom:8px; }
.v6-dim .top { display:flex; align-items:center; gap:9px; margin-bottom:5px; }
.v6-dim .nm { font-size:13.5px; font-weight:800; color:#111827; }
.v6-dim .lv { font-size:11.5px; font-weight:800; border-radius:5px; padding:2px 9px; }
.v6-dim .why { font-size:12.5px; color:#4B5563; line-height:1.78; }
.v6-dim .ev { margin-top:7px; padding:8px 11px; background:#fff; border:1px dashed #D6CCBC;
  border-radius:7px; font-size:12px; color:#4B5563; line-height:1.75; }
.v6-dim .ev .k { color:#6B7280; font-weight:700; }
.v6-note { font-size:11.8px; color:#6B7280; line-height:1.7; }
@media (max-width:640px){
  .md-wrap { padding:14px 15px; }
  .md-body { font-size:13px; }
  .v6-body { padding:13px; }
}

/* ===== 决策建议书排版（重做）===== */
.hr-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
.hr-head { display:flex; align-items:center; justify-content:space-between; gap:10px;
  align-content:center;
  padding:12px 16px; background:linear-gradient(135deg,#EFF6FF,#F5F9FF);
  border-bottom:1px solid var(--border); }
.hr-head .ttl { font-size:14.5px; font-weight:800; color:#1D4ED8; display:flex; align-items:center; gap:8px; line-height:1.2; }
.hr-head .cp { font-size:13px; color:#1D4ED8; background:#fff; border:1.5px solid #93C5FD;
  border-radius:7px; padding:5px 13px; cursor:pointer; font-family:inherit; font-weight:700; }
.hr-head .cp:hover { background:var(--primary-light); }
.hr-body { padding:16px; }

/* 结论：主色大卡 */
.hr-concl { background:linear-gradient(135deg,#EAF3FF 0%,#F7FBFF 100%); border:1px solid #BFDBFE;
  border-left:8px solid var(--primary); border-radius:10px; padding:17px 20px; margin-bottom:18px;
  box-shadow:0 2px 10px rgba(37,99,235,.07); }
.hr-concl .lb { font-size:14px; font-weight:800; color:#1E4E8C; letter-spacing:.06em;
  margin-bottom:9px; display:flex; align-items:center; gap:7px; }
.hr-concl .tx { font-size:17px; font-weight:700; color:#111827; line-height:1.80;
  letter-spacing:.01em; }

/* 小标题 */
.hr-sec { margin-bottom:14px; }
.hr-sec:last-child { margin-bottom:0; }
.hr-sec > .lb { font-size:14px; font-weight:800; color:#374151; letter-spacing:.05em;
  margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.hr-sec > .lb .ic { font-size:15px; line-height:1; }

/* 三步行动 */
.hr-step { display:flex; gap:12px; padding:11px 13px; background:#F8F3EC;
  border:1px solid #E3D9C8; border-radius:9px; margin-bottom:8px; line-height:1.72; }
.hr-step:last-child { margin-bottom:0; }
.hr-step .n { flex:0 0 22px; height:22px; border-radius:50%; background:var(--primary); color:#fff;
  font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.hr-step .tx { font-size:13.5px; color:#1F2937; line-height:1.72; }
.hr-step .tx b { color:var(--primary); }

/* 盲区 */
.hr-blind { background:#FFE8D1; border:1px solid #F5C68F; border-left:5px solid #B45309;
  border-radius:9px; padding:13px 15px; font-size:13.5px; line-height:1.82; color:#111827; }
.hr-blind .k { color:var(--warn); font-weight:700; }

/* 依据：弱化脚注 */
.hr-evid { font-size:12.5px; color:#3F3F46; line-height:1.88; padding-left:14px;
  border-left:3px solid #D6CCBC; }


/* 步骤内部的「结论 / 支撑 / 动作」子行 */
.hr-sub { display:flex; gap:8px; margin-top:7px; padding-top:7px; border-top:1px dashed #E3D9C8; }
.hr-sub:first-of-type { border-top:none; padding-top:0; }
.hr-sub .sk { flex:0 0 40px; font-size:12px; font-weight:800; color:#1D4ED8;
  background:#DBEAFE; border:1px solid #BFDBFE; border-radius:5px; padding:1px 0;
  text-align:center; height:1.7em; line-height:1.7em; }
.hr-sub .sv { font-size:12.8px; color:#1F2937; line-height:1.8; }

/* 降级：首行强调 + 其余平铺 */
.hr-fallback .lead { font-size:15px; font-weight:700; color:var(--primary); line-height:1.65; margin-bottom:10px; }
.hr-fallback .rest { font-size:13.5px; line-height:1.9; white-space:pre-wrap;
  overflow-wrap:anywhere; word-break:break-word; color:#1F2937; }

@media (max-width:640px){
  .hr-body { padding:12px; }
  .hr-concl .tx { font-size:15px; }
  .hr-step { padding:9px 10px; }
}

/* 报告 */
.report-box { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:14px; font-size:13px; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; max-width:100%; }
/* V15 修复（2026-10-09）：报告里含知网等超长 URL（200+ 字符无空格），pre-wrap 不会断行会撑破容器。
   overflow-wrap:anywhere + word-break 让长串强制折行；表格单元格同理。 */
.report-box table, .report-box td, .report-box th { overflow-wrap:anywhere; word-break:break-word; }
.report-box a { overflow-wrap:anywhere; word-break:break-all; }
.report-box .one-line { font-size:15px; font-weight:700; color:var(--primary); margin-bottom:10px; }
.report-box .sec { margin-bottom:8px; }
.report-box .sec b { color:var(--primary); }
.dim-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.dim-box { background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; text-align:center; flex:1; min-width:90px; }
.dim-box .v { font-size:20px; font-weight:800; color:var(--primary); }
.dim-box .l { font-size:11px; color:var(--dim); margin-top:2px; }
.loading { color:var(--primary); font-size:13px; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.preset-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
.preset-card { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; transition:all .15s; }
.preset-card:hover { border-color:var(--primary); background:var(--primary-light); }
.preset-card .t { font-size:13px; font-weight:600; margin-bottom:4px; }
.preset-card .d { font-size:11px; color:var(--dim); }
.hidden { display:none; }

/* ===== 移动端适配（手机/平板） ===== */
@media (max-width: 768px) {
  .topbar { padding: 12px 16px; }
  .topbar h1 { font-size: 16px; }
  .topbar > div:last-child { display: none; }  /* 隐藏副标语，省空间 */
  .wrap { flex-direction: column; }
  /* 侧边栏 → 顶部横条导航 */
  .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border);
             padding: 8px 10px; display: flex; gap: 6px; overflow-x: auto; }
  .sidebar .nav-item { flex: 1; justify-content: center; padding: 10px 8px;
                       font-size: 13px; white-space: nowrap; }
  .main { padding: 14px; }
  /* 团队 3列 → 2列（手机更紧凑） */
  .team-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .member .m-speech { min-height: 38px; font-size: 11px; }
  /* 卡片间距压缩 */
  .card { padding: 14px; margin-bottom: 12px; }
  .card h3 { font-size: 14px; }
  /* 输入框/按钮触屏友好 */
  input[type=text], textarea, select { font-size: 15px; padding: 12px 12px; }
  textarea { min-height: 60px; }
  .btn { padding: 12px 18px; font-size: 14px; }
  /* 预设卡片单列 */
  .preset-grid { grid-template-columns: 1fr; }
  .preset-card { padding: 14px; }
  .preset-card .t { font-size: 14px; }
  .preset-card .d { font-size: 12px; }
  /* 评分块两列 */
  .dim-box { min-width: 44%; }
  /* 日志区更高（手机看更多） */
  .log-area { max-height: 340px; }
  .log-item { font-size: 13px; }
  /* 报告字号稍大（手机阅读） */
  .report-box { font-size: 14px; padding: 12px; }
  /* 顶部操作行：按钮和输入不挤 */
  #view-start .card > div:nth-child(4) { flex-wrap: wrap; }
  #scenarioSelect { width: 100% !important; margin-bottom: 8px; }
  #startBtn { width: 100%; }
  .loading { width: 100%; margin-top: 6px; }
}

/* ---- 首屏品牌与可信度（2026-10-21 提升专业感）---- */
.qz-brand{display:flex;align-items:center;gap:.55rem;justify-content:center;
  margin-bottom:1.15rem;letter-spacing:.18em;font-size:.78rem;
  color:rgba(226,232,240,.72);text-transform:uppercase}
.qz-brand .qz-dots{display:inline-flex;gap:3px;align-items:center}
.qz-brand .qz-dots i{width:5px;height:5px;border-radius:50%;
  background:rgba(120,170,255,.85);display:block}
.qz-brand .qz-brand-name{color:#EAF2FF;font-weight:600;letter-spacing:.32em}
.qz-brand .qz-brand-en{opacity:.65;letter-spacing:.14em;font-size:.72rem}
.qz-h1sub{margin-top:.9rem;color:rgba(214,224,238,.78);font-size:clamp(.82rem,2.1vw,.95rem);
  line-height:1.75;max-width:34rem;margin-left:auto;margin-right:auto;font-weight:300}
.qz-cred{display:flex;flex-wrap:wrap;gap:.55rem 1.1rem;justify-content:center;
  margin-top:22px;font-size:.74rem;color:rgba(196,210,230,.66);letter-spacing:.02em}
.qz-cred span{white-space:nowrap}
.qz-cred b{color:rgba(150,190,255,.92);font-weight:600;margin-right:.25em}
/* qz-skip 样式沿用文件原有的规则（本块已并入） */

</style>
<!-- ===== 群智 · 涌现 开场（v2：四幕叙事 + 用户主动进入）===== -->
<style id="qz-intro-css">
#qz-intro{position:fixed;inset:0;z-index:99999;background:#0A0F1A;overflow:hidden;
  transition:opacity .5s ease;opacity:1;font-family:inherit}
#qz-intro.qz-intro-out{opacity:0}
#qz-intro-cv{position:absolute;inset:0;display:block}
#qz-intro-vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at center,rgba(10,15,26,0) 34%,rgba(10,15,26,.92) 100%)}
#qz-intro-fly{position:absolute;inset:0;pointer-events:none;z-index:5}
#qz-intro-fly span{position:absolute;font-size:18px;font-weight:600;
  transform:translate(-50%,-50%);opacity:0;white-space:nowrap;
  text-shadow:0 0 10px rgba(255,122,69,.9),0 2px 6px rgba(0,0,0,.85);
  animation:qzFlyOut .95s cubic-bezier(.25,.6,.35,1) forwards}
/* ① 发散：按 --dx/--dy 向四周飞散并淡出，而不是原地堆着 */
@keyframes qzFlyOut{
  0%  {opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.55)}
  16% {opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1.1)}
  55% {opacity:.85;transform:translate(-50%,-50%) translate(calc(var(--dx) * .55),calc(var(--dy) * .55)) scale(.95)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.55)}
}

/* 四个场景层：默认隐藏，.qz-on 才出现 */
#qz-intro-s1,#qz-intro-s2,#qz-intro-s3,#qz-intro-s4{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .7s ease, transform .65s cubic-bezier(.2,.9,.3,1);z-index:4}
/* ① 第四幕出现时，标题整层上移，与下方按钮分离（原本两者都 justify-content:center → 按钮和标题重叠） */
#qz-intro-s3.qz-up{transform:translateY(-168px)}   /* 原 -78px：副标改两行后压住第四幕按钮 */

#qz-intro-s1.qz-on,#qz-intro-s2.qz-on,#qz-intro-s3.qz-on,#qz-intro-s4.qz-on{

/* ② 文字区柔和暗底：解决"主标题被粒子线段穿插遮挡" */
#qz-intro-s2.qz-on,#qz-intro-s3.qz-on{
  background:radial-gradient(ellipse 58% 38% at 50% 50%,
    rgba(6,10,18,.90) 0%,rgba(6,10,18,.68) 48%,rgba(6,10,18,0) 100%)}
#qz-intro-s1{align-items:center;justify-content:center}

/* ---- 第一幕 ---- */
.qz-h1{color:rgba(255,248,240,.90);font-size:clamp(1.5rem,4.6vw,2.5rem);font-weight:300;

  letter-spacing:.06em;animation:qzUp .55s ease .22s both}
@keyframes qzUp{from{opacity:0;transform:translateY(16px);filter:blur(6px)}
  to{opacity:1;transform:none;filter:blur(0)}}
.qz-row{margin-top:1.6rem;width:min(92vw,560px);animation:qzUp .55s ease .34s both}
#qz-in{width:100%;box-sizing:border-box;background:rgba(255,248,240,.05);
  border:1px solid rgba(255,248,240,.22);border-radius:999px;color:#FFF8F0;

#qz-in::placeholder{color:rgba(214,226,245,.80)}
#qz-in:focus{border-color:rgba(74,140,255,.85);background:rgba(46,107,230,.14);

.qz-samples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px;

.qz-samples button:hover{background:rgba(46,107,230,.28);border-color:rgba(74,140,255,.7);

#qz-go{margin-top:22px;background:linear-gradient(135deg,#2E6BE6,#4A8CFF);border:none;

#qz-go:hover:not(:disabled){transform:translateY(-2px);

@keyframes qzShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}

#qz-in.qz-shake{animation:qzShake .42s ease;border-color:rgba(255,150,120,.85)!important;

@media (prefers-reduced-motion:reduce){#qz-intro{display:none!important}}

/* ① 退出时快速淡出（.30s）—— 否则「同一件事，六个人会给出六个答案」会与标题「群智 · 涌现」重叠 */

<body>
<div class="topbar">
  <h1><img class="logo-img" src="static/logo.png" alt="群智" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';"> <span class="logo" style="display:none;">🧠</span> 群智 · 科研决策预演智能体 <span class="badge">V15</span></h1>
  <div style="font-size:12px;color:var(--dim);">不是人问AI答，而是AI团队替你预演决策</div>
</div>
<div class="wrap">
  <aside class="sidebar">
    <div class="nav-item active" data-view="start">🚀 发起预演</div>
    <div class="nav-item" data-view="monitor">📡 讨论监控</div>
    <div class="nav-item" data-view="result">📊 决策报告</div>
  </aside>
  <main class="main">
    <!-- 发起预演 -->
    <div id="view-start" class="view">
      <div class="card">
        <h3><span class="ico">🎯</span> 发起一场科研决策预演</h3>
        <div style="margin-bottom:12px;"><label>输入你的课题</label>
          <input type="text" id="topicInput" placeholder="例如：大学生使用AI写作业，学校该禁止还是引导？">
        </div>
        <div style="margin-bottom:12px;"><label>你的初步想法（可选，主教练会帮你挖认知盲区）</label>
          <textarea id="thoughtInput" placeholder="例如：应该引导而非禁止，但不知道怎么落地"></textarea>
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;">
          <select id="scenarioSelect" style="width:160px;">
            <option value="教研">教研决策</option>
            <option value="科研">科研决策</option>
            <option value="通用">通用预演</option>
          </select>
          <button class="btn" id="startBtn">🚀 启动预演</button>
          <span class="loading hidden" id="startingMsg">主教练正在联网检索并组建AI团队...</span>
        </div>
        <!-- B9（2026-10-10）：网络资料白名单网开关。默认关闭 = 只用论文（与既有实验口径一致）；
             勾上则本局启用规则白名单，只有政府/国际组织/高校/权威媒体以及有 DOI/学术域名的
             网络源才会进池，其余在注入前剔除并在「检索漏斗」里列出明细。 -->
        <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;padding:9px 11px;background:var(--bg);border-radius:8px;">
          <input type="checkbox" id="allowWebChk" style="margin-top:3px;">
          <label for="allowWebChk" style="cursor:pointer;font-size:12.5px;line-height:1.7;">
            启用<b>网络资料白名单网</b>（本局）
            <span style="color:var(--dim);">— 不勾＝只用学术文献（默认）；勾上后网络资料只有
            <b>政府/国际组织/高校/权威媒体</b>或<b>有 DOI / 学术域名</b>的才进池，
            其余在注入前剔除，明细见报告的「检索漏斗」</span>
          </label>
        </div>
        <!-- V16.2 插件化：评审器由用户自己选 ——「老版本就是快，新版本需要更多时间，让用户自己选」。
             清单从 /api/review/plugins 动态取（本页无写死的评审器），因此以后新增评审器不用改前端。 -->
        <div style="margin-bottom:12px;padding:10px 12px;background:var(--bg);border-radius:8px;">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px;">🔍 评审器（自己选：要快，还是要准）</div>
          <div id="pluginPicker" style="display:flex;flex-direction:column;gap:7px;">
            <span style="font-size:12px;color:var(--dim);">正在读取可用评审器…</span>
          </div>
        </div>
        <div id="startStatus" style="font-size:13px;color:var(--dim);"></div>
        <!-- 输入澄清卡片（默认隐藏，点启动预演后按需展开） -->
        <div id="intentBox" class="hidden" style="margin-top:14px;border:1px solid #DED7CC;
             border-radius:12px;background:#fff;padding:16px 18px;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            <span id="intentBadge" style="font-size:12px;font-weight:600;border-radius:5px;
                  padding:2px 9px;background:#EEF3FE;color:#1D4ED8;border:1px solid #D3E0FA;"></span>
            <span id="intentClarity" style="font-size:12px;color:#6E6858;"></span>
            <span id="intentReason" style="font-size:12px;color:#6E6858;"></span>
          </div>
          <div id="intentMissing" style="font-size:12.5px;color:#91621A;background:#FCF4E4;
               border:1px solid #F0E0BD;border-radius:8px;padding:9px 12px;margin-bottom:12px;
               line-height:1.7;"></div>
          <div style="font-size:12px;color:#6E6858;margin-bottom:6px;">
            建议改成下面这个更明确的问题（可以直接编辑）：
          </div>
          <textarea id="intentRewrite" rows="3" style="width:100%;box-sizing:border-box;
               border:1px solid #DED7CC;border-radius:8px;padding:10px 12px;font-size:13.5px;
               line-height:1.6;font-family:inherit;color:#17171C;resize:vertical;"></textarea>
          <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
            <button id="intentUseBtn" type="button" style="border:none;border-radius:8px;
                 background:#1D4ED8;color:#fff;padding:9px 18px;font-size:13px;font-weight:600;
                 cursor:pointer;font-family:inherit;">用这个提法开始</button>
            <button id="intentRawBtn" type="button" style="border:1px solid #CFC7B8;border-radius:8px;
                 background:#fff;color:#3A3A42;padding:9px 18px;font-size:13px;
                 cursor:pointer;font-family:inherit;">按我的原文开始</button>
          </div>
          <div style="font-size:11.5px;color:#8B8578;margin-top:9px;line-height:1.6;">
            澄清只是建议：问题越明确，6 个角色越不会把时间浪费在猜你的意图上。
          </div>
        </div>
      </div>
      <div class="card">
        <h3><span class="ico">📚</span> 预设教研课题（一键演示）</h3>
        <div class="preset-grid" id="presetGrid"></div>
      </div>
    </div>

    <!-- 讨论监控 -->
    <div id="view-monitor" class="view hidden">
      <div class="card">
        <h3><span class="ico">📡</span> 实时讨论监控 <span id="sessionLabel" style="font-size:12px;color:var(--dim);"></span></h3>
        <div class="log-area" id="logArea"><div style="color:var(--dim);font-size:13px;">启动预演后，这里实时显示AI团队讨论过程...</div></div>
      </div>
      <div class="card">
        <h3><span class="ico">🎭</span> AI 团队</h3>
        <div class="team-grid" id="teamGrid"></div>
      </div>
    </div>

    <!-- 决策报告 -->
    <div id="view-result" class="view hidden">
      <div class="card">
        <h3><span class="ico">📊</span> 决策预演报告</h3>
        <div id="resultBox"><div style="color:var(--dim);font-size:13px;">讨论完成后，这里展示决策报告、评分与认知盲区。</div></div>
      </div>
    </div>
  </main>
</div>

<script>
// API 地址：自动取当前页面域名（本地=127.0.0.1:5020，公网=同源隧道地址）
// 体验版（nginx /staging/ 反代）：接口必须带上前缀，否则会打到线上
var API = (window.location.pathname.indexOf("/staging") === 0)
  ? (window.location.protocol + "//" + window.location.host + "/staging")
  : (window.location.protocol + "//" + window.location.host);
var ACCESS_KEY = "__QZ_DEMO_KEY__";   // 访问口令（与后端一致）
var currentSession = null;
// v6 等待计数（V16.1）：报告 done 之后 v6 还要约 157 秒才回来，用它在 done 之后继续轮询
var v6WaitTries = 0;

// ====================================================================
// 会话状态保持（V16.1，2026-10-11）
// 用户原话：「我在页面刷新过后，我原有的报告也消失了，跟我们正常用的网页不一样」
// —— 这句话是对的。会话本来就存在**服务端**（/api/sandbox/result/<session_id>），
//    前端却把它只放在一个内存变量里，刷新必然丢。这不是"限制"，是缺陷。
// 修法（按正常网页的做法）：
//   ① 会话号写进 **URL**（`?session=...`）→ 可收藏、可分享、可前进后退；
//   ② 同时写 **localStorage** → 下次直接打开首页也能自动回到上一局；
//   ③ 记住**停在哪个标签页**，刷新后回到同一页。
//   读取优先级：URL > localStorage（URL 更具体，且支持"把这个结果发给别人"）。
// ====================================================================
function rememberSession(sid){
  if(!sid) return;
  try{ localStorage.setItem("qz_last_session", sid); }catch(e){}
  try{
    var u = new URL(window.location.href);
    u.searchParams.set("session", sid);      // 保留原有的 ?key=...
    history.replaceState(null, "", u.toString());
  }catch(e){}
}
function readSessionFromLocation(){
  try{
    var s = new URLSearchParams(window.location.search).get("session");
    if(s) return s;
  }catch(e){}
  try{ return localStorage.getItem("qz_last_session"); }catch(e){ return null; }
}
/* ===== [patch] ?reset=1 清除历史记忆，回到第一页 ===== */
var QZ_RESET = (function(){
  try { return new URLSearchParams(location.search).get("reset") === "1"; } catch(e){ return false; }
})();
if (QZ_RESET) {
  try {
    localStorage.removeItem("qz_last_view");
    localStorage.removeItem("qz_last_session");
  } catch(e){}
  try {
    var u = new URL(location.href);
    u.searchParams.delete("session");
    u.searchParams.delete("reset");
    history.replaceState(null, "", u.pathname + (u.search ? u.search : ""));
  } catch(e){}
}

function rememberView(v){
  try{ localStorage.setItem("qz_last_view", v); }catch(e){}
}
function readViewFromLocation(){
  try{ return localStorage.getItem("qz_last_view"); }catch(e){ return null; }
}
var eventSource = null;

// 统一请求：自动带访问口令（用 query 参数，避免自定义 header 触发 CORS 预检）
function apiFetch(url, opts){
  opts = opts || {};
  url = url + (url.indexOf("?") >= 0 ? "&" : "?") + "key=" + ACCESS_KEY;
  return fetch(url, opts);
}

// Tab 切换
document.querySelectorAll(".nav-item").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".nav-item").forEach(function(x){x.classList.remove("active");});
    this.classList.add("active");
    document.querySelectorAll(".view").forEach(function(x){x.classList.add("hidden");});
    document.getElementById("view-" + this.dataset.view).classList.remove("hidden");
    rememberView(this.dataset.view);      // V16.1：记住标签页，刷新后回到同一页
  });
});

// 加载预设
apiFetch(API + "/api/presets").then(function(r){return r.json();}).then(function(d){
  var grid = document.getElementById("presetGrid");
  (d.presets||[]).forEach(function(p){
    var card = document.createElement("div");
    card.className = "preset-card";
    card.innerHTML = '<div class="t">🎯 ' + esc(p.title) + '</div><div class="d">' + esc(p.description) + '</div>';
    card.onclick = function(){
      document.getElementById("topicInput").value = p.title;
      document.getElementById("thoughtInput").value = p.user_thought || "";
      document.getElementById("scenarioSelect").value = p.scenario === "科研" ? "科研" : "教研";
    };
    grid.appendChild(card);
  });
});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

// ====================================================================
// 决策建议书渲染（重做 2026-10-18）
// 后端 _humanize_report 产出固定格式纯文本，这里解析成有层级的卡片。
// 解析失败自动降级为「首行强调 + 其余平铺」，不劣于原来的 pre-wrap。
// ====================================================================
function hrClean(s){
  return String(s==null?"":s)
    .replace(/\*\*(.+?)\*\*/g, "$1")     // 去 markdown 粗体
    .replace(/^#+\s*/gm, "")             // 去标题井号
    .replace(/^[-*]\s+/gm, "")           // 去列表符号
    .trim();
}
function hrUnwrap(s){
  // 去掉外层【】与多余引号
  var x = String(s==null?"":s).trim();
  x = x.replace(/^[【\[]\s*/, "").replace(/\s*[】\]]$/, "");
  x = x.replace(/^["“”]+|["“”]+$/g, "");
  return x.trim();
}
function hrBold(s){
  // 把 **x** 转成 <b>，其余转义
  var parts = String(s==null?"":s).split(/\*\*(.+?)\*\*/g);
  var out = "";
  for (var i = 0; i < parts.length; i++) {
    out += (i % 2 === 1) ? "<b>" + esc(parts[i]) + "</b>" : esc(parts[i]);
  }
  return out;
}

// ====================================================================
// 轻量 Markdown 渲染（2026-10-18）
// 目的：完整讨论报告原先 esc() 直出，满屏 ## ** 1. 原始符号。
// 安全：**先 esc 再变换**，所有 HTML 都由本函数生成，不引入用户内容里的标签。
// 支持：# ~ ### 标题、**粗体**、`代码`、- / 1. 列表、> 引用、--- 分隔线、|表格|
// ====================================================================
function mdInline(s){
  return s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function renderMarkdown(src){
  var txt = esc(String(src == null ? "" : src)).replace(/\r/g, "");
  var lines = txt.split("\n");
  var out = [], list = null, para = [], tbl = [];

  function flushPara(){
    if (para.length) { out.push("<p>" + mdInline(para.join(" ")) + "</p>"); para = []; }
  }
  function flushList(){
    if (list) { out.push("<" + list.tag + ">" + list.items.map(function(x){return "<li>"+mdInline(x)+"</li>";}).join("") + "</" + list.tag + ">"); list = null; }
  }
  function flushTable(){
    if (!tbl.length) return;
    var rows = tbl.map(function(r){
      return r.replace(/^\||\|$/g, "").split("|").map(function(c){ return c.trim(); });
    }).filter(function(r){ return !r.every(function(c){ return /^:?-{2,}:?$/.test(c) || c === ""; }); });
    if (rows.length){
      var h = rows[0], body = rows.slice(1);
      var s = '<table class="mdt"><thead><tr>' + h.map(function(c){return "<th>"+mdInline(c)+"</th>";}).join("") + "</tr></thead><tbody>";
      body.forEach(function(r){
        s += "<tr>" + h.map(function(_, i){ return "<td>" + mdInline(r[i] || "") + "</td>"; }).join("") + "</tr>";
      });
      out.push(s + "</tbody></table>");
    }
    tbl = [];
  }

  for (var i = 0; i < lines.length; i++){
    var raw = lines[i], L = raw.trim();

    if (/^\|/.test(L)) { flushPara(); flushList(); tbl.push(L); continue; }
    if (tbl.length && !/^\|/.test(L)) flushTable();

    if (!L) { flushPara(); flushList(); continue; }
    if (/^-{3,}$/.test(L) || /^\*{3,}$/.test(L)) { flushPara(); flushList(); out.push("<hr>"); continue; }

    var mh = L.match(/^(#{1,6})\s+(.*)$/);
    if (mh) {
      flushPara(); flushList();
      var lv = Math.min(mh[1].length, 3);
      out.push("<h" + lv + ">" + mdInline(mh[2]) + "</h" + lv + ">");
      continue;
    }
    var mq = L.match(/^&gt;\s?(.*)$/);
    if (mq) { flushPara(); flushList(); out.push("<blockquote>" + mdInline(mq[1]) + "</blockquote>"); continue; }

    var mo = L.match(/^(\d+)[.、)]\s+(.*)$/);
    if (mo) {
      flushPara();
      if (!list || list.tag !== "ol") { flushList(); list = {tag:"ol", items:[]}; }
      list.items.push(mo[2]); continue;
    }
    var mu = L.match(/^[-*+]\s+(.*)$/);
    if (mu) {
      flushPara();
      if (!list || list.tag !== "ul") { flushList(); list = {tag:"ul", items:[]}; }
      list.items.push(mu[1]); continue;
    }
    flushList();
    para.push(L);
  }
  flushPara(); flushList(); flushTable();
  return out.join("");
}
function mdCopy(btn){
  var box = document.getElementById("mdBody");
  if (!box) return;
  var txt = box.innerText || box.textContent || "";
  var done = function(){ btn.textContent = "已复制 ✓"; setTimeout(function(){ btn.textContent = "复制全文"; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(function(){ mdCopyFallback(txt, done); });
  } else { mdCopyFallback(txt, done); }
}
function mdCopyFallback(txt, done){
  try {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy");
    document.body.removeChild(ta); done();
  } catch (e) {}
}

function renderHumanReport(txt){
  if (!txt) return "";
  var raw = String(txt).replace(/\r/g, "");
  var lines = raw.split("\n");

  // ① 顶层只认**完整标签**（短标签「结论」「支撑」在真实数据里是步骤内部的子行）
  var SEC = [
    ["concl", /^(一句话结论|核心结论)[：:]?\s*$/],
    ["concl", /^(一句话结论|核心结论)[：:]\s*/],
    ["steps", /^(给决策者的?三步行动|三步行动|行动建议)[：:]?\s*$/],
    ["steps", /^(给决策者的?三步行动|三步行动|行动建议)[：:]\s*/],
    ["blind", /^(你的认知盲区|认知盲区)[：:]?\s*$/],
    ["blind", /^(你的认知盲区|认知盲区)[：:]\s*/],
    ["evid",  /^(支撑细节|依据)[：:]?\s*$/],
    ["evid",  /^(支撑细节|依据)[：:]\s*/]
  ];
  // ② 子行标签（步骤内部）
  var SUB = [
    ["结论", /^结论[：:]\s*/],
    ["支撑", /^支撑[：:]\s*/],
    ["动作", /^动作[：:]\s*/]
  ];

  var concl = [], steps = [], blind = [], evid = [], other = [];
  var cur = "other";

  function bucket(k) { return {concl: concl, steps: steps, blind: blind, evid: evid, other: other}[k]; }

  for (var i = 0; i < lines.length; i++) {
    var L = hrClean(lines[i]);
    if (!L) continue;

    // 顶层分段？
    var hit = null, rest = "";
    for (var s = 0; s < SEC.length; s++) {
      var m = L.match(SEC[s][1]);
      if (m) { hit = SEC[s][0]; rest = L.slice(m[0].length).trim(); break; }
    }
    if (hit) { cur = hit; if (rest) bucket(cur).push({t: rest, sub: ""}); continue; }

    // 步骤编号行（① ② ③ 或 【…】 单独成行）
    var mnum = L.match(/^[①②③④⑤⑥⑦⑧⑨⑩][\s\u3000]*/);
    if (mnum) {
      cur = "steps";
      steps.push({t: hrUnwrap(L.slice(mnum[0].length).trim()), sub: ""});
      continue;
    }

    // 子行标签？
    var subHit = null, subRest = "";
    for (var k = 0; k < SUB.length; k++) {
      var m2 = L.match(SUB[k][1]);
      if (m2) { subHit = SUB[k][0]; subRest = L.slice(m2[0].length).trim(); break; }
    }
    if (subHit) {
      if (cur === "steps" && steps.length) {
        steps[steps.length - 1].sub += (steps[steps.length - 1].sub ? "\n" : "") + subHit + "｜" + subRest;
      } else if (cur === "blind" || cur === "evid" || cur === "concl") {
        bucket(cur).push({t: subRest, sub: subHit});
      } else {
        other.push({t: subRest, sub: subHit});
      }
      continue;
    }

    // 普通行：并入当前段
    if (cur === "steps" && steps.length) {
      steps[steps.length - 1].t += " " + L;
    } else {
      bucket(cur).push({t: L, sub: ""});
    }
  }

  function joinTxt(arr) {
    return arr.map(function(x){ return x.t; }).filter(function(x){ return x; }).join(" ");
  }
  function subRows(subStr) {
    if (!subStr) return "";
    var out = "";
    subStr.split("\n").forEach(function(row){
      var p = row.split("｜");
      var k = p.shift(); var v = p.join("｜");
      out += '<div class="hr-sub"><span class="sk">' + esc(k) + '</span>'
           + '<span class="sv">' + hrBold(hrUnwrap(v)) + '</span></div>';
    });
    return out;
  }

  var found = (concl.length ? 1 : 0) + (steps.length ? 1 : 0) + (blind.length ? 1 : 0);
  var h = '<div class="hr-wrap"><div class="hr-head"><div class="ttl">💡 决策建议</div>'
        + '<button class="cp" type="button" onclick="hrCopy(this)">复制全文</button></div>'
        + '<div class="hr-body" id="hrBody">';

  if (found < 2) {
    var all = lines.map(hrClean).filter(function(x){ return x; });
    var lead = all.length ? hrUnwrap(all[0]) : "";
    var rest2 = all.slice(1).join("\n");
    h += '<div class="hr-fallback">'
       + (lead ? '<div class="lead">' + hrBold(lead) + '</div>' : "")
       + (rest2 ? '<div class="rest">' + esc(rest2) + '</div>' : "")
       + '</div></div></div>';
    return h;
  }

  if (concl.length) {
    h += '<div class="hr-concl"><div class="lb">一句话结论</div><div class="tx">'
       + hrBold(hrUnwrap(joinTxt(concl))) + '</div></div>';
  }
  if (steps.length) {
    h += '<div class="hr-sec"><div class="lb"><span class="ic">🧭</span><span>三步行动</span></div>';
    for (var s2 = 0; s2 < steps.length; s2++) {
      h += '<div class="hr-step"><div class="n">' + (s2 + 1) + '</div><div class="tx">'
         + hrBold(hrUnwrap(steps[s2].t)) + subRows(steps[s2].sub) + '</div></div>';
    }
    h += '</div>';
  }
  if (blind.length) {
    h += '<div class="hr-sec"><div class="lb"><span class="ic">⚠️</span><span>你的认知盲区</span></div>'
       + '<div class="hr-blind">' + hrBold(hrUnwrap(joinTxt(blind))) + '</div></div>';
  }
  if (evid.length) {
    h += '<div class="hr-sec"><div class="lb"><span class="ic">📎</span><span>依据</span></div>'
       + '<div class="hr-evid">' + hrBold(hrUnwrap(joinTxt(evid))) + '</div></div>';
  }
  if (other.length) {
    h += '<div class="hr-sec"><div class="lb"><span class="ic">➕</span><span>其他</span></div>'
       + '<div class="hr-evid">' + hrBold(hrUnwrap(joinTxt(other))) + '</div></div>';
  }
  h += '</div></div>';
  return h;
}

// 评审器选择器（V16.2 插件化）
// 用户要求：「v3 的保留，就是给用户一个选择的机会，老版本就是快，新版本需要更多的时间，
//           让用户自己选」。所以这里把每个插件的**耗时/成本/产出/已知缺陷**都摆出来，
//           让用户在有信息的情况下取舍，而不是我们替他决定。
// 清单**从后端动态取**（不写死）→ 以后加评审器不用动前端。
// ====================================================================
(function loadReviewPlugins(){
  apiFetch(API + "/api/review/plugins").then(function(r){return r.json();}).then(function(d){
    var box = document.getElementById("pluginPicker");
    if(!box) return;
    var ps = (d && d.plugins) || [];
    if(!ps.length){
      box.innerHTML = '<span style="font-size:12px;color:#DC2626;">⚠️ 没有可用评审器'
        + (d && d.load_errors ? '（加载失败：' + esc(JSON.stringify(d.load_errors)) + '）' : '') + '</span>';
      return;
    }
    var html = "";
    ps.forEach(function(p){
      var dis = p.available ? "" : " disabled";
      html += '<label style="display:flex;gap:8px;align-items:flex-start;cursor:' + (p.available?"pointer":"not-allowed") + ';'
            + (p.available ? "" : "opacity:.55;") + '">'
            + '<input type="radio" name="reviewPlugin" value="' + esc(p.id) + '"'
            + (p.default && p.available ? " checked" : "") + dis + ' style="margin-top:3px;">'
            + '<span style="font-size:12.5px;line-height:1.6;">'
            + '<b>' + esc(p.name) + '</b> '
            + '<span style="color:var(--dim);">约 ' + esc(p.eta_sec) + ' 秒 ｜ 成本 ' + esc(p.cost)
            + ' ｜ 产出：' + esc((p.metrics||[]).join('、')) + '</span>'
            + '<br><span style="color:var(--dim);">' + esc(p.desc||'') + '</span>';
      if(p.caveat){
        html += '<br><span style="color:#D97706;">⚠️ 已知缺陷：' + esc(p.caveat) + '</span>';
      }
      if(!p.available){
        html += '<br><span style="color:#DC2626;">✗ 当前不可用：' + esc(p.unavailable_reason||'原因未给出') + '</span>';
      }
      html += '</span></label>';
    });
    box.innerHTML = html;
  }).catch(function(){
    var box = document.getElementById("pluginPicker");
    if(box) box.innerHTML = '<span style="font-size:12px;color:#DC2626;">⚠️ 评审器清单读取失败（不影响发起预演，将使用默认评审器）</span>';
  });
})();

// 启动预演
function doStart(topic){
  var btn = document.getElementById("startBtn");
  btn.disabled = true;
  document.getElementById("startingMsg").classList.remove("hidden");
  apiFetch(API + "/api/sandbox/start", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      topic: topic,
      user_thought: document.getElementById("thoughtInput").value.trim(),
      max_rounds: 3,
      info_mode: "coach_search",
      scenario: document.getElementById("scenarioSelect").value,
      // B9：未勾选时显式传 false（"只用论文"），勾选才传 true（开白名单网）
      allow_web: !!(document.getElementById("allowWebChk") || {}).checked,
      // V16.2 插件化：把用户选的评审器一起发过去（老版快 / 新版准，由用户自己权衡）
      review_plugin: (function(){
        var el = document.querySelector('input[name="reviewPlugin"]:checked');
        return el ? el.value : null;
      })()
    })})

  .then(function(r){return r.json();})
  .then(function(d){
    document.getElementById("startingMsg").classList.add("hidden");
    btn.disabled = false;
    if(d.status === "started"){
      currentSession = d.session_id;
      // V16.1：会话号写进 URL + localStorage，刷新/收藏/分享都不丢
      rememberSession(currentSession);
      document.getElementById("startStatus").innerHTML = "✅ 预演已启动，切换到「讨论监控」查看实时过程";
      document.getElementById("sessionLabel").textContent = "（" + d.session_id + "）";
      document.getElementById("logArea").innerHTML = "";
      initTeam();
      connectStream(d.session_id);
      document.querySelector('[data-view="monitor"]').click();
    } else {
      document.getElementById("startStatus").textContent = "⚠️ 启动失败：" + JSON.stringify(d);
    }
  })
  .catch(function(e){
    document.getElementById("startingMsg").classList.add("hidden");
    btn.disabled = false;
    document.getElementById("startStatus").textContent = "⚠️ 连接失败：" + e.message;
  });
}

// ---- 启动预演：先做一次输入意图体检，再决定是否澄清 ----
document.getElementById("startBtn").onclick = function(){
    /* ===== [patch] ?nointent=1 跳过意图体检，立即开始（录屏用） ===== */
    var QZ_NOINTENT = (function(){
      try { return new URLSearchParams(location.search).get("nointent") === "1"; } catch(e){ return false; }
    })();
    if (QZ_NOINTENT) {
      var _t0 = (document.getElementById("topicInput") || {}).value || "";
      _t0 = (_t0 || "").trim();
      if (!_t0) {
        var _st = document.getElementById("startStatus");
        if (_st) _st.textContent = "⚠️ 请输入课题";
        return;
      }
      doStart(_t0);
      return;
    }

  var topic = document.getElementById("topicInput").value.trim();
  if(!topic){ alert("请输入课题"); return; }
  var box = document.getElementById("intentBox");
  var status = document.getElementById("startStatus");
  if(box) box.classList.add("hidden");
  status.textContent = "正在检查输入是否明确…";

  var thought = document.getElementById("thoughtInput") ? document.getElementById("thoughtInput").value.trim() : "";
  apiFetch(API + "/api/intent", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({topic: topic, user_thought: thought})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      // 接口失败 / 判定够明确 → 直接开始，用户无感
      if(!d || d.ok === false || !d.needs_clarify){
        status.textContent = "";
        doStart(topic);
        return;
      }
      // 需要澄清 → 展开卡片
      status.textContent = "";
      var map = {A:"研究问题", B:"方案比较", C:"初步想法"};
      document.getElementById("intentBadge").textContent = map[d.intent] || "输入";
      document.getElementById("intentClarity").textContent = "明确度 " + d.clarity + "/100";
      document.getElementById("intentReason").textContent = d.reason || "";
      var miss = d.missing || [];
      var mEl = document.getElementById("intentMissing");
      if(miss.length){
        mEl.style.display = "";
        mEl.innerHTML = "还缺这几样：<br>" + miss.map(function(x){
          return "· " + esc(String(x));
        }).join("<br>");
      } else {
        mEl.style.display = "none";
      }
      var rw = document.getElementById("intentRewrite");
      rw.value = d.rewritten || topic;
      box.classList.remove("hidden");

      document.getElementById("intentUseBtn").onclick = function(){
        var v = (rw.value || "").trim() || topic;
        box.classList.add("hidden");
        doStart(v);
      };
      document.getElementById("intentRawBtn").onclick = function(){
        box.classList.add("hidden");
        doStart(topic);
      };
    })
    .catch(function(){
      // 网络异常也不阻塞
      status.textContent = "";
      doStart(topic);
    });
};

// SSE 讨论流
// ====================================================================
// 渲染一条讨论日志（V16.4 抽出）
// 抽出来的原因：用户反馈「我的讨论记录怎么又不见了」——
//   讨论日志**只在 SSE 实时流里渲染过**，刷新后没人重放。
//   而 `session.logs` 一直是落盘的（50 条，字段与 SSE 完全一致）。
//   数据没丢，只是**从来没人把它画出来**。现在 SSE 与重放共用这一个渲染器，
//   避免"两处各写一份、改一处忘一处"。
// ====================================================================
function renderLogItem(item, opts){
  opts = opts || {};
  var area = document.getElementById("logArea");
  if(!area || !item) return;
  var div = document.createElement("div");
  if(item.type === "speech"){
    div.className = "log-item speech" + (item.collision ? " collision" : "");
    div.innerHTML = '<b>' + esc(item.player||"") + '</b> · ' + esc(item.prototype_name||"") + ' · ' + esc(item.profession_name||"") + (item.collision ? ' <span style="color:#D97706;font-size:11px;">⚡跨学科碰撞</span>' : '') + '<br>' + esc(item.message||"");
    var mem = document.getElementById("member-" + item.player);
    if(mem && mem.querySelector(".m-speech")){
      mem.querySelector(".m-speech").textContent = item.message || "";
      mem.querySelector(".m-sub").textContent = (item.prototype_name||"") + " · " + (item.profession_name||"") + " · " + (item.value_name||"");
    }
  } else if(item.type === "round"){
    div.className = "log-item round";
    div.textContent = "📌 " + (item.message||"");
  } else if(item.type === "system" && (item.message||"").indexOf("干预") >= 0){
    div.className = "log-item intervention";
    div.textContent = "🧠 " + (item.message||"");
  } else {
    div.className = "log-item system";
    div.textContent = (item.message||"");
  }
  if(opts.append) area.appendChild(div);
  else area.appendChild(div);
  if(opts.scroll !== false) area.scrollTop = area.scrollHeight;
}

// 重放落盘的历史讨论记录（刷新/换设备/服务重启后都能看到全过程）
function replayLogs(logs){
  var area = document.getElementById("logArea");
  if(!area || !logs || !logs.length) return false;
  area.innerHTML = '<div class="log-item system" style="color:var(--dim);">📂 以下是从本地存档重放的**完整讨论记录**（'
    + logs.length + ' 条）——刷新或重启都不会丢。</div>';
  logs.forEach(function(it){ renderLogItem(it, {scroll:false}); });
  area.scrollTop = 0;
  return true;
}

function connectStream(sid){
  if(eventSource) eventSource.close();
  eventSource = new EventSource(API + "/api/sandbox/stream?session_id=" + encodeURIComponent(sid) + "&key=" + ACCESS_KEY);
  eventSource.onmessage = function(ev){
    try{
      var item = JSON.parse(ev.data);
      var area = document.getElementById("logArea");
      if(item.type === "done"){
        area.innerHTML += '<div class="log-item system">✅ 讨论完成，正在生成决策报告...</div>';
        eventSource.close();
        setTimeout(loadResult, 1500);
        return;
      }
      renderLogItem(item);
    }catch(e){}
  };
  // SSE 出错就关掉，绝不自动重连。
  // 事故（2026-10-11 03:50）：会话已结束时服务端返回空流 → 浏览器 EventSource 每 3 秒
  // 自动重连、无限刷请求。服务端已加 retry:1小时 兜底（对已打开页面也生效），
  // 这里再补一道客户端防线。
  eventSource.onerror = function(){
    try{ eventSource.close(); }catch(e){}
  };
}

// 加载结果
function loadResult(){
  if(!currentSession) return;
  apiFetch(API + "/api/sandbox/result/" + currentSession).then(function(r){return r.json();}).then(function(d){
    if(d.status !== "done"){ setTimeout(loadResult, 3000); return; }

    // 评审 v6 是**独立线程**跑的，实测**报告出完后还要约 157 秒**才回来（锚点自检 12 次调用
    // + 三模型分维，且 check_anchors 是串行的）。
    // 原先这里一旦 done 就**停止轮询** → v6 永远轮不到 → 用户看到"没有 v6"，
    // 再手动刷新又因为会话号没存而整页消失（2026-10-11 用户实测反馈）。
    // 现在：done 之后若还没拿到 v6，继续轮询（最长约 5 分钟），并在页面上明确显示"计算中"。

      v6WaitTries = (v6WaitTries || 0) + 1;
      if(v6WaitTries <= 100){                       // 100 × 3s ≈ 5 分钟
        var _rb = document.getElementById("resultBox");

          _rb.innerHTML = '<div style="padding:14px;background:var(--card2);border-radius:10px;font-size:13px;">' +

            '<span style="color:var(--dim);">已等待 ' + (v6WaitTries*3) + ' 秒…</span>' +
            '<div style="font-size:11.5px;color:var(--dim);margin-top:6px;">这一页会自动刷新出结果，无需手动刷新。</div></div>';
        }
        setTimeout(loadResult, 3000); return;
      }
    }
    var box = document.getElementById("resultBox");
    var html = "";
    // 定位声明（2026-10-19）：产品只做「决策预演」，不做「研究报告」。
    // 讨论里有文献/有结构/有结论，很容易被读成研究分析 —— 必须放在最上方显式说清。
    if(d.positioning && d.positioning.title){
      var _p = d.positioning;
      html += '<div class="pos-box">'
        + '<div class="pt">🎯 ' + esc(_p.title) + '</div>'
        + (_p.what_it_is ? '<div class="pi"><b>它是什么：</b>' + esc(_p.what_it_is) + '</div>' : '')
        + (_p.what_it_is_not ? '<div class="pi"><b>它不是什么：</b>' + esc(_p.what_it_is_not) + '</div>' : '')

        + '</div>';
    }
    // V16.1：若这份结果是**服务端从磁盘读回的历史记录**，明确告知用户

    if(d.restored_from_disk){
      html += '<div style="margin-bottom:10px;padding:9px 12px;background:#EFF6FF;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:12.5px;">' +
        '📂 <b>这是历史记录</b>（服务重启后从本地存档读回' + (d.saved_at ? '，保存于 ' + esc(d.saved_at) : '') + '）。' +
        '<span style="color:var(--dim);">内容完整可查；重新发起一次预演请用上方「发起预演」。</span></div>';

    var ivs = d.interventions || [], sigs = d.round_signals || [];

        html += '</tbody></table></div>'
          + '<div style="font-size:11.5px;color:var(--dim);margin-top:6px;">信号全部在本地按固定阈值计算（重复率≥0.55、跑题度≥0.65、张力≤0.15、未补证≥3 条、本轮无引用），不调用模型判断"要不要干预"。</div>'

    // ================================================================

        '综合评分：<b>' + esc(vr["综合评分"]) + '</b>（旧口径，勿用于结论）</div>';
      // 原文依据仍然可查（这是 v3 里唯一有价值的部分，保留可核查性）
      html += '<details style="margin-top:8px;"><summary style="font-size:11.5px;color:var(--dim);cursor:pointer;">查看旧五维分数与原文依据</summary><div style="margin-top:6px;">';
      ["深度","广度","涌现度","实用性","分歧质量"].forEach(function(k){
        var s = (vr.scores || {})[k];
        if(!s) return;
        html += '<div style="padding:6px 0;border-bottom:1px dashed var(--border);">' +
          '<div style="font-size:12px;font-weight:700;">' + esc(k) + ' <span style="color:var(--dim);">' + esc(s.score) + ' 分</span>' +
          '<span style="font-size:11px;color:var(--dim);font-weight:400;"> ｜ 置信度 ' + esc(s.confidence || '-') + '/10 ｜ ' + esc(s.role || '') + '</span></div>' +
          '<div style="font-size:11.5px;color:var(--dim);line-height:1.65;margin-top:3px;">' + esc(s.evidence || '（未提供）') + '</div></div>';
      });
      html += '</div></details>';
      // 审计五维 + 方法论四维（同为 1–10 旧口径，一并留档；**不再作为主读数展示**）
      var au = vr.audit_scores || {}, me = vr.methodology_scores || {};
      var auKeys = Object.keys(au), meKeys = Object.keys(me);
      if(auKeys.length || meKeys.length){
        html += '<details style="margin-top:8px;"><summary style="font-size:11.5px;color:var(--dim);cursor:pointer;">查看旧「内容可靠性 / 方法论审计」分数（同为 1–10 旧口径）</summary><div style="margin-top:6px;">';
        if(auKeys.length){
          html += '<div style="font-size:11.5px;font-weight:700;margin-bottom:4px;">内容可靠性五维</div>';
          auKeys.forEach(function(k){
            var s = au[k];
            html += '<div style="font-size:11.5px;color:var(--dim);line-height:1.7;">· ' + esc(k) + '：<b style="color:var(--text);">' + esc(s.score) + '</b>（置信度' + esc(s.confidence || '-') + '）' + (s.evidence ? ' — ' + esc(String(s.evidence).slice(0, 90)) : '') + '</div>';
          });
        }
        if(meKeys.length){
          html += '<div style="font-size:11.5px;font-weight:700;margin:8px 0 4px;">方法论审计</div>';
          meKeys.forEach(function(k){
            var s = me[k];
            html += '<div style="font-size:11.5px;color:var(--dim);line-height:1.7;">· ' + esc(k) + '：<b style="color:var(--text);">' + esc(s.score) + '</b>' + (s.evidence ? ' — ' + esc(String(s.evidence).slice(0, 90)) : '') + '</div>';
          });
        }
        html += '</div></details>';
      }
      html += '</details>';
    }
    // 原始报告
    if(d.report){
      // V15 优化（2026-09-25）：报告正文末尾的 Markdown 参考文献表由代码追加，
      // 前端已用结构化表格单独渲染（见下方「引用核验 + 参考文献」），
      // 这里截断，避免同一份文献清单以纯文本形式重复出现、并把超长 URL 撑破容器。
      var repText = String(d.report);
      var cut = repText.indexOf("### 参考文献");
      var hadRefBlock = cut >= 0;
      if (hadRefBlock) repText = repText.slice(0, cut).replace(/\s+$/, "");
      // 2026-10-22：原始讨论记录默认折叠 —— 主内容是上面的预演结论，
      // 6969 字的原始报告直接铺开会让整页显得「散」。收起但保留可展开（透明度不丢）。
      html += '<details class="md-wrap" style="margin-top:4px;">'
        + '<summary style="cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;'
        + 'padding:11px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;'
        + 'font-size:12.5px;color:var(--dim);user-select:none;">'
        + '<span>📄 <b style="color:var(--text);">完整讨论记录</b>'
        + '<span style="font-size:11.5px;">　' + esc(String(repText.length)) + ' 字 · '
        + '6 个角色的原始发言与分歧，点开可查看</span></span>'
        + '<span style="margin-left:auto;font-size:11.5px;">展开 ▾</span>'
        + '</summary>'
        + '<div class="md-head" style="margin-top:10px;">'
        + '<div class="t">📄 完整讨论报告<span style="font-weight:400;font-size:11.5px;color:var(--dim);">'
        + esc(repText.length + ' 字') + '</span></div>'
        + '<button class="b" type="button" onclick="mdCopy(this)">复制全文</button></div>'
        + '<div class="md-body" id="mdBody">' + renderMarkdown(repText) + '</div>'
        + (hadRefBlock ? '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--dim);">📚 参考文献见下方「引用核验」表格（由系统生成，未经模型改写）</div>' : '')
        + '</details>';
    }
    // ---- V15 优化（2026-09-25）：引用核验 + 参考文献（由代码生成，非模型生成）----
    var cc = d.citation_check || null, refs = d.references || [];
    if(cc || refs.length){
      var bColor = "#059669", bText = (cc && cc.verdict) ? cc.verdict : "引用已核验";
      if(cc && cc.phantom_count > 0){ bColor = "#DC2626"; bText = "⚠️ 检出引用了不存在的编号（疑似编造）"; }
      else if(cc && cc.unsupported_count > 0){ bColor = "#D97706"; bText = "有 " + cc.unsupported_count + " 处含数字/年份的断言未标注出处"; }
      html += '<div style="margin-top:12px;padding:12px 14px;background:var(--card2);border-radius:10px;border-left:4px solid ' + bColor + ';">'
        + '<div style="font-size:13px;font-weight:700;color:' + bColor + ';">🔗 引用核验：' + esc(bText) + '</div>';
      if(cc){
        html += '<div style="font-size:12px;color:var(--dim);margin-top:6px;line-height:1.8;">'
          + '有出处 <b style="color:var(--text);">' + esc(cc.cited_count || 0) + '</b> 处　｜　'
          + '引用了不存在的编号 <b style="color:' + ((cc.phantom_count || 0) > 0 ? '#DC2626' : 'var(--text)') + ';">' + esc(cc.phantom_count || 0) + '</b> 处　｜　'
          + '未标注出处的断言 <b style="color:var(--text);">' + esc(cc.unsupported_count || 0) + '</b> 处　｜　'
          + '信息池 ' + esc(cc.pool_size || 0) + ' 篇</div>';
        if((cc.phantom || []).length){
          html += '<div style="font-size:12px;color:#DC2626;margin-top:5px;line-height:1.7;">⚠️ 报告中出现了信息池里不存在的编号：'
            + esc(cc.phantom.join("、")) + '。系统判定为疑似编造引用，请以下方参考文献表为准。</div>';
        }
        if((cc.unsourced_numbers || []).length){
          html += '<details open style="margin-top:6px;"><summary style="font-size:12px;color:#DC2626;cursor:pointer;font-weight:600;">⚠️ 无出处数字（疑似幻觉，' + cc.unsourced_numbers.length + ' 处）</summary>'
            + '<div style="margin-top:4px;font-size:12px;color:var(--dim);line-height:1.75;">'
            + '以下句子含具体数字并声称有外部依据，但在本轮信息池中<b style="color:#DC2626;">查无实据</b>，请勿直接采信：<br>'
            + (cc.unsourced_numbers || []).map(function(x){ return '· ' + esc(x); }).join('<br>') + '</div></details>';
        }
        if((cc.unsupported || []).length){
          html += '<details style="margin-top:6px;"><summary style="font-size:12px;color:var(--dim);cursor:pointer;">查看未标注出处的断言（' + cc.unsupported.length + ' 条）</summary>'
            + '<div style="margin-top:4px;font-size:12px;color:var(--dim);line-height:1.75;">'
            + (cc.unsupported || []).map(function(x){ return '· ' + esc(x); }).join('<br>') + '</div></details>';
        }
      }
      if(cc){
        var ss = (d.v15_meta && d.v15_meta.search && d.v15_meta.search.source_status) || null;
        if(ss && Object.keys(ss).length){
          var parts = [];
          Object.keys(ss).forEach(function(k){
            var v = ss[k] || {}, n = v.count || 0;
            var tag = n > 0 ? ('✅ ' + n + ' 条') : (v.error ? ('⚠️ ' + String(v.error).slice(0, 26)) : '— 无结果');
            parts.push('<span style="white-space:nowrap;">' + esc(k) + '：' + esc(tag) + '</span>');
          });
          html += '<div style="margin-top:6px;font-size:11.5px;color:var(--dim);line-height:1.9;">' +
            '<b>检索来源台账</b>（区分"没有数据"与"被限速/超时"）：' + parts.join('　') + '</div>';
        }
        // B9（2026-10-10）：检索漏斗——把"检索→去重→三无→类型过滤→撤稿→注入"逐级计数摆出来。
        // 开了网络资料白名单网时，这一段还会带上"网络源 N 条：放行 可信a/学术b，剔除 c"。
        var fu = (d.v15_meta && d.v15_meta.search && d.v15_meta.search.funnel) || null;
        if(fu && fu.funnel_text){
          html += '<details style="margin-top:6px;"><summary style="font-size:11.5px;color:var(--dim);cursor:pointer;">'
            + '🔎 检索漏斗（逐级计数，可回放）</summary>'
            + '<div style="margin-top:5px;font-size:11.5px;color:var(--dim);line-height:1.9;overflow-wrap:anywhere;">'
            + esc(fu.funnel_text) + '</div></details>';
        }
      }
      if(refs.length){
        // V15 修复（2026-10-09）：按来源性质拆成两块——
        // 参考文献只收学术来源（期刊/会议/出版机构/DOI），网页新闻/自媒体单列，
        // 避免"今日头条"这类内容被当成参考文献展示。
        var acRefs = refs.filter(function(r){ return (r.kind || '') === 'academic'; });
        var webRefs = refs.filter(function(r){ return (r.kind || '') !== 'academic'; });
        if(acRefs.length){
          html += '<details open style="margin-top:9px;"><summary style="font-size:12.5px;color:var(--primary);cursor:pointer;font-weight:600;">📚 参考文献（' + acRefs.length + ' 篇，学术来源）</summary>'
            + '<div style="margin-top:8px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;">'
            + '<thead><tr>' + ['编号','标题','作者','来源','级别','年份','被引','链接']
                .map(function(h){return '<th style="text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);color:var(--dim);font-weight:600;">' + h + '</th>';}).join("")
            + '</tr></thead><tbody>';
          acRefs.forEach(function(r){
            // 级别：CSSCI / 北大核心 / CSSCI扩展 / 国际 Q1… —— 依据公开名录与 SJR 分区
            var lv = r.journal_level || '';
            if(!lv) lv = (r.journal_tier === 1 ? 'CSSCI' : r.journal_tier === 2 ? '北大核心' : r.journal_tier === 11 ? 'CSSCI扩展' : '—');
            var lvColor = (lv.indexOf('CSSCI') === 0) ? '#059669' : (lv === '北大核心' ? '#2563EB' : (lv.indexOf('国际 Q1') === 0 || lv.indexOf('国际 Q2') === 0 ? '#7C3AED' : 'var(--dim)'));
            html += '<tr>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);color:var(--primary);font-weight:700;white-space:nowrap;">' + esc(r.ref_no || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);overflow-wrap:anywhere;">' + esc(r.title || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);color:var(--dim);overflow-wrap:anywhere;">' + esc(r.authors || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);color:var(--dim);overflow-wrap:anywhere;">' + esc(r.journal || r.source || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);font-weight:700;color:' + lvColor + ';white-space:nowrap;">' + esc(lv) + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);color:var(--dim);white-space:nowrap;">' + esc(r.year || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);color:var(--dim);">' + esc(r.cite || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);">'
              + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" style="color:var(--primary);">链接</a>' : '<span style="color:var(--dim);">—</span>') + '</td>'
              + '</tr>';
          });
          html += '</tbody></table></div>'
            + '<div style="font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.7;">本表由系统按主教练实际注入的信息池自动生成，<b>未经语言模型改写</b>，<b>仅收录可溯源到期刊/会议/出版机构或 DOI 的学术来源</b>。「级别」依据公开名录判定：<b>CSSCI 来源期刊目录（2025-2026）</b>、<b>《中文核心期刊要目总览》（2023 年版）</b>、<b>SJR 2025 分区（Scimago）</b>。报告正文中的 [P1] 等编号即指向本表。</div>'
            + '</details>';
        }
        if(webRefs.length){
          // B9（2026-10-10）：网络资料只有在开了白名单网（QUNZHI_ALLOW_WEB=1）时才会出现，
          // 因此这里加一列「可信度」把判定来源（可信来源/学术来源）摆出来——你能看到
          // 进池的每一条网络资料为什么被放行。未开网时该列为空，与旧界面一致。
          var hasTier = webRefs.some(function(r){ return !!r.source_tier_label; });
          html += '<details style="margin-top:8px;"><summary style="font-size:12.5px;color:var(--warn);cursor:pointer;font-weight:600;">🌐 网络资料（' + webRefs.length + ' 条，非学术来源）</summary>'
            + '<div style="margin-top:8px;overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;">'
            + '<thead><tr>' + (hasTier ? ['编号','标题','来源站点','可信度','链接'] : ['编号','标题','来源站点','链接'])
                .map(function(h){return '<th style="text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);color:var(--dim);font-weight:600;">' + h + '</th>';}).join("")
            + '</tr></thead><tbody>';
          webRefs.forEach(function(r){
            var host = ''; try { host = new URL(r.url || '').hostname; } catch(e) { host = '-'; }
            var tier = r.source_tier_label || '';
            var tierColor = (tier.indexOf('可信') === 0) ? '#059669' : (tier.indexOf('学术') === 0 ? '#2563EB' : 'var(--dim)');
            html += '<tr>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);color:var(--warn);font-weight:700;white-space:nowrap;">' + esc(r.ref_no || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);overflow-wrap:anywhere;">' + esc(r.title || "-") + '</td>'
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);color:var(--dim);overflow-wrap:anywhere;">' + esc(host) + '</td>'
              + (hasTier ? ('<td style="padding:5px 6px;border-bottom:1px dashed var(--border);font-weight:700;color:' + tierColor + ';white-space:nowrap;" title="' + esc(r.source_tier_reason || '') + '">' + esc(tier || '—') + '</td>') : '')
              + '<td style="padding:5px 6px;border-bottom:1px dashed var(--border);">'
              + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" style="color:var(--primary);">链接</a>' : '<span style="color:var(--dim);">—</span>') + '</td>'
              + '</tr>';
          });
          html += '</tbody></table></div>'
            + '<div style="font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.7;">以下为检索到的<b>网页/新闻/自媒体</b>内容，仅作背景参考，<b>不作为文献依据</b>；正文若引用请写明「据网络报道」。'
            + (hasTier ? '「可信度」由<b>规则白名单</b>判定（政府/国际组织/高校/权威媒体为"可信来源"，有 DOI 或学术域名为"学术来源"）；<b>白名单外的网络源已在注入前剔除</b>，剔除明细见上方「检索漏斗」。' : '')
            + '</div>'
            + '</details>';
        }
      } else if(refs.length === 0 && cc && cc.pool_size){
        html += '<div style="font-size:12px;color:var(--dim);margin-top:6px;">本轮信息池无学术来源。</div>';
      }
      html += '</div>';
    }
    // 深批者视角（对抗性评审——AI 自己挑自己毛病）
    if(d.deep_critic && d.deep_critic.length > 20){
      html += '<div style="margin-top:14px;padding:14px 16px;background:#1F2937;border-radius:10px;font-size:13px;color:#E5E7EB;line-height:1.8;border-left:4px solid #EF4444;">' +
        '<div style="font-weight:700;margin-bottom:8px;color:#FCA5A5;">🧐 深批者视角 <span style="font-weight:400;font-size:11px;color:#9CA3AF;">（对抗性评审：AI 建议的边界在哪？）</span></div>' +
        '<div style="white-space:pre-wrap;">' + esc(d.deep_critic) + '</div></div>';
    }
    // 诚实声明（底部小字：AI 偏理想化，需人类判断）
    html += '<div style="margin-top:12px;padding:10px 12px;background:#F5F0E8;border-radius:8px;font-size:11.5px;color:var(--dim);line-height:1.7;">' +
      '⚠️ <b>诚实声明：</b>' + esc(d.honesty_note || "AI 团队讨论天然偏理想化——真实世界的预算约束、利益博弈、执行阻力，需要你在决策时自行补上。本报告仅供参考，不替代专业判断。") + '</div>';
    // 用户反馈（比赛实证收集）
    html += '<div class="card" style="margin-top:14px;"><h3><span class="ico">💬</span> 这个预演对你有帮助吗？</h3>' +
      '<div style="font-size:26px;margin-bottom:10px;" id="starRow">' +
      '⭐<span style="font-size:14px;color:var(--dim);margin-left:8px;">点击星星打分</span></div>' +
      '<div style="display:flex;gap:4px;margin-bottom:10px;">' +
      [1,2,3,4,5].map(function(n){ return '<span class="star" data-v="'+n+'" style="font-size:30px;cursor:pointer;color:#d1d5db;" onclick="pickStar('+n+')">★</span>'; }).join("") +
      '</div>' +
      '<textarea id="feedbackComment" placeholder="你的感受/建议（一句话就行）..." style="margin-bottom:10px;"></textarea>' +
      '<button class="btn" onclick="submitFeedback(\'' + esc(d.topic||"") + '\')">📮 提交反馈</button>' +
      '<div id="feedbackMsg" style="font-size:12px;color:var(--green);margin-top:8px;"></div></div>';
    box.innerHTML = html;
    document.querySelector('[data-view="result"]').click();
  });
}

// ====================================================================
// 启动时恢复上一局（V16.1 新增，2026-10-11）
// 事故背景：用户"刷新过后全部消失了 / 我原有的报告也消失了，跟我们正常用的网页不一样"——
// 会话号只存在内存变量 currentSession 里，一刷新就丢；而结果页内容完全依赖它。
// 会话是**服务端本来就有的**（/api/sandbox/result/<sid>），没有任何理由让它随刷新消失。
// 现在：① 会话号同时写 URL(?session=) 与 localStorage；② 页面加载时读回；
//       ③ 恢复你上次停在的标签页；④ 若 v6 还在算，loadResult 会持续轮询并显示"计算中"。
// ====================================================================
(function restoreLastSession(){
  try{
    var sid = readSessionFromLocation();
    var view = readViewFromLocation();
    if(view && view !== "start"){
      var nb = document.querySelector('[data-view="' + view + '"]');
      if(nb) nb.click();
    } else if(sid){
      var rb = document.querySelector('[data-view="result"]');
      if(rb) rb.click();                       // 有会话但没记标签页 → 默认回结果页
    }
    if(!sid) return;
    currentSession = sid;
    var lbl = document.getElementById("sessionLabel");
    if(lbl) lbl.textContent = "（" + sid + "，已恢复上一局）";
    var st = document.getElementById("startStatus");
    if(st) st.innerHTML = "↩️ 已恢复你上一次的预演（" + sid + "）"
      + "——链接已带上会话号，<b>可收藏、可分享</b>。如需重新发起，直接在上方填写课题即可。";
    // 注意：loadResult() 结尾会**自动跳到结果页**，所以停在「讨论监控」时不能调它，
    // 否则刷新后标签页会被抢走（那也是"跟正常网页不一样"的一种表现）。
    if(view === "monitor"){
      connectStream(sid);        // 重连实时日志流（讨论还在跑时能接着看）
      loadResultSilently();      // 静默取一次状态：讨论已完成则重放历史记录，但不切页
    } else {
      loadResult();
    }
  }catch(e){ /* 恢复失败不影响正常使用 */ }
})();

// 静默取状态：不渲染结果页、不切换标签页。仅用于"停在监控页刷新"时判断讨论是否已完成。
function loadResultSilently(){
  if(!currentSession) return;
  apiFetch(API + "/api/sandbox/result/" + currentSession)
    .then(function(r){return r.json();})
    .then(function(d){
      var area = document.getElementById("logArea");
      if(!d || !area) return;
      // V16.4：**把落盘的讨论记录重放出来**。
      // 用户反馈「我的讨论记录怎么又不见了」——根因是日志只在 SSE 里画过，
      // 刷新后没人重放（而 session.logs 一直存着）。这里补上重放。
      if(d.logs && d.logs.length){
        replayLogs(d.logs);
        if(d.status === "done"){
          area.innerHTML += '<div class="log-item system">✅ 本局讨论已完成 —— '
            + '点上方「📊 决策报告」查看完整报告与评审读数。</div>';
        }
        return;
      }
      if(d.status === "done"){
        area.innerHTML += '<div class="log-item system">✅ 本局讨论已完成 —— '
          + '点上方「📊 决策报告」查看完整报告与评审读数。</div>';
      }
    }).catch(function(){});
}

var pickedRating = 0;
function pickStar(n){
  pickedRating = n;
  document.querySelectorAll(".star").forEach(function(s){
    s.style.color = parseInt(s.dataset.v) <= n ? "#F59E0B" : "#d1d5db";
  });
}
function submitFeedback(topic){
  var comment = document.getElementById("feedbackComment").value.trim();
  if(!pickedRating){ document.getElementById("feedbackMsg").textContent = "请先点星星打分"; return; }
  apiFetch(API + "/api/feedback", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({topic: topic, rating: pickedRating, comment: comment, session_id: currentSession||""})})
  .then(function(r){return r.json();})
  .then(function(d){
    var msg = document.getElementById("feedbackMsg");
    if(d.ok){
      msg.textContent = "✅ 感谢反馈！已记录（当前平均 " + d.stats.avg_rating + " 分，共 " + d.stats.total + " 条）";
    } else {
      msg.textContent = "提交失败，但你的体验对我们很重要";
    }
  }).catch(function(){ document.getElementById("feedbackMsg").textContent = "网络错误，稍后再试"; });
}
</script>

  (document.body || document.documentElement).appendChild(ov);

  var cv = document.getElementById("qz-intro-cv");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1, R = 0, CX = 0, CY = 0;
  var mouse = { x: 0, y: 0, tx: 0, ty: 0 };

  function show(id, on) {
    var el = document.getElementById(id);
    if (el) el.classList.toggle("qz-on", !!on);
  }
  show("qz-intro-s1", true);

  /* ---------------- 几何：斐波那契球 + 近邻连边 + 关键边 ---------------- */
  var pts = [], edges = [], keyEdge = -1, keyA = 0, keyB = 0;
  (function build() {
    var n = 118, ga = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < n; i++) {
      var y = 1 - (i / (n - 1)) * 2, rad = Math.sqrt(Math.max(0, 1 - y * y)), th = ga * i;
      // ④ 半径 ±2.5% 抖动，避免"完美球壳"的塑料感
      var jr = 1 + (Math.random() - 0.5) * 0.05;
      pts.push({ x: Math.cos(th) * rad * jr, y: y * jr, z: Math.sin(th) * rad * jr });
    }
    var maxD = 0.62, cnt = new Array(n).fill(0);
    for (var a = 0; a < n; a++) {
      for (var b = a + 1; b < n; b++) {
        if (cnt[a] >= 3 || cnt[b] >= 3) continue;
        var dx = pts[a].x - pts[b].x, dy = pts[a].y - pts[b].y, dz = pts[a].z - pts[b].z;
        if (dx * dx + dy * dy + dz * dz < maxD * maxD) { edges.push([a, b]); cnt[a]++; cnt[b]++; }
      }
    }
    // 关键边：跨画面中心、最显眼的一条
    var best = -1, bestScore = -1e9;
    for (var e = 0; e < edges.length; e++) {
      var A = pts[edges[e][0]], B = pts[edges[e][1]];
      var span = Math.abs(A.x - B.x);
      var front = -(A.z + B.z);
      var middle = 1 - Math.abs((A.x + B.x) / 2);
      var sc = span * 1.2 + front * 0.9 + middle * 0.8;
      if (sc > bestScore) { bestScore = sc; best = e; }
    }
    keyEdge = best; keyA = edges[best][0]; keyB = edges[best][1];
  })();

  /* ---------------- 粒子 ---------------- */
  var P = [], ACC = [];        // ACC = 用户问题的异色粒子
  function mkP(p, spread) {
    p.ti = Math.floor(Math.random() * pts.length);
    var t = pts[p.ti];
    p.tx = t.x; p.ty = t.y; p.tz = t.z;
    var ang = Math.random() * Math.PI * 2, rr = (spread || 2.1) + Math.random() * 1.4;
    p.sx = Math.cos(ang) * rr; p.sy = Math.sin(ang) * rr; p.sz = (Math.random() - 0.5) * 1.6;
    // 贝塞尔控制点（垂直方向随机偏移）
    var mx = (p.sx + p.tx) / 2, my = (p.sy + p.ty) / 2;
    var nx = -(p.ty - p.sy), ny = (p.tx - p.sx);
    var nl = Math.sqrt(nx * nx + ny * ny) || 1;
    var bend = (Math.random() * 0.55 + 0.25) * (Math.random() < 0.5 ? -1 : 1);
    p.cx = mx + (nx / nl) * bend;
    p.cy = my + (ny / nl) * bend;
    p.fx = (Math.random() - 0.5) * 2.6;
    p.fy = (Math.random() - 0.5) * 2.6;
    p.fz = (Math.random() - 0.5) * 1.4;
    p.ph = Math.random() * 6.2832;
    p.warm = Math.random() < 0.42;
    p.r = 0.7 + Math.random() * 1.5;

    p.dur = 1.55 * (0.85 + Math.random() * 0.35); // 飞行时长 ×0.85–1.2（放慢）

  }

      gr.addColorStop(0.55, "rgba(29,78,216,0.16)");

  /* ---------------- 镜头（意见 2：三目标） ---------------- */
  var cam = { zoom: 1, zoomT: 1, zoomV: 0, shiftX: 0, shiftXT: 0, yaw: 0, yawT: 0 };
  function project(x, y, z, rotY, rotX) {
    var cy = Math.cos(rotY), sy = Math.sin(rotY);
    var X = x * cy - z * sy, Z = x * sy + z * cy;
    var cx2 = Math.cos(rotX), sx2 = Math.sin(rotX);
    var Y = y * cx2 - Z * sx2, Z2 = y * sx2 + Z * cx2;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  /* ---------------- 状态 ---------------- */

  var RIPPLE_SPEED = 1.45;
  var FREEZE_MS = 1700;           // 放慢：0.9s → 1.7s，让虚线有足够时间生长

    }
