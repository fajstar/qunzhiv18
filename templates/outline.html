<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大纲树 · 群智</title>
<style>
  :root{
    --paper:#FAF6F0; --paper2:#F3EDE3; --card:#FFFFFF; --ink:#15181D; --ink2:#3A4048;
    --dim:#8A8579; --line:#E7DFD2; --accent:#C2402B; --deep:#8C2E1E;
    --ok:#2F7D4F; --warn:#B7791F; --bad:#B23B2E;
    --hl:#FFFAEB; --hl-line:#FFE08A;
    --serif:"Noto Serif SC","Songti SC",SimSun,Georgia,serif;
    --mono:"JetBrains Mono",Consolas,monospace;
    --sh1:0 1px 2px rgba(21,24,29,.04),0 3px 10px rgba(21,24,29,.05);
    --sh2:0 2px 6px rgba(21,24,29,.06),0 14px 30px rgba(21,24,29,.08);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);font:15px/1.65 var(--serif);background:var(--paper);
       background-image:linear-gradient(180deg,rgba(194,64,38,.05),rgba(194,64,38,0) 260px)}
  ::selection{background:var(--hl-line);color:var(--ink)}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 22px 90px}

  /* ---------- 头部 / 操作区 ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
         position:relative;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
  header::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:var(--accent)}
  h1{font-size:26px;line-height:1.25;margin:0;font-weight:700;letter-spacing:.01em}
  h1::before{content:"";display:inline-block;width:4px;height:18px;margin-right:11px;
             vertical-align:-2px;border-radius:2px;background:var(--accent)}
  .sub{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.75;max-width:46ch}
  #srcLine a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(194,64,43,.35)}
  #srcLine a:hover{border-bottom-color:var(--accent)}
  .acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .act-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-left:16px;border-left:1px solid var(--line)}
  .act-group:first-child{padding-left:0;border-left:0}
  .act-new .btn{box-shadow:0 1px 0 rgba(140,46,30,.45),0 6px 16px rgba(194,64,38,.2)}
  .act-build .btn{background:var(--card)}
  .act-audit .btn{background:var(--paper);color:var(--ink2)}
  .act-audit .btn:hover{background:var(--card);color:var(--warn);border-color:rgba(183,121,31,.55);box-shadow:none}
  .act-export{gap:6px}
  .act-export .btn{background:var(--paper);color:var(--dim);font-size:12.5px;padding:6px 11px}
  .act-export .btn:hover{background:var(--card);color:var(--accent);border-color:rgba(194,64,38,.38)}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 14px;font-size:13px;
       font-family:var(--serif);cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block;
       transition:border-color .15s ease,color .15s ease,background .15s ease,box-shadow .15s ease,transform .15s ease}
  .btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--sh1);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF;font-weight:600}
  .btn.primary:hover{background:var(--deep);border-color:var(--deep);color:#FFFFFF}
  .btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
  .btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid rgba(194,64,38,.5);outline-offset:2px}

  /* ---------- 两栏 / 卡片容器 ---------- */
  .layout{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;box-shadow:var(--sh1)}
  .panel h2{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;margin:0 0 14px;
            padding-bottom:11px;border-bottom:1px solid var(--line);color:var(--ink2);letter-spacing:.16em}
  .panel h2::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  #pool-count{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--accent);
              background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-left:auto}
  .pool,.rev-list,.dom-body,.cmp-body{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .pool::-webkit-scrollbar,.rev-list::-webkit-scrollbar,.dom-body::-webkit-scrollbar,.cmp-body::-webkit-scrollbar{width:8px;height:8px}
  .pool::-webkit-scrollbar-thumb,.rev-list::-webkit-scrollbar-thumb,.dom-body::-webkit-scrollbar-thumb,
  .cmp-body::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--card);border-radius:999px;background-clip:padding-box}
  .pool::-webkit-scrollbar-track,.rev-list::-webkit-scrollbar-track,.dom-body::-webkit-scrollbar-track,.cmp-body::-webkit-scrollbar-track{background:transparent}

  /* ---------- 左栏：文献池 ---------- */
  .pool{max-height:min(70vh,660px);overflow:auto;display:flex;flex-direction:column;gap:3px;padding-right:5px;margin-right:-5px}
  .pool-item{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid transparent;
             border-radius:10px;cursor:pointer;font-size:12.5px;line-height:1.55;
             transition:background .15s ease,border-color .15s ease,transform .15s ease}
  .pool-item:hover{background:var(--paper);border-color:var(--line)}
  .pool-item:active{transform:scale(.995)}
  .pool-item .no{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 30px;padding-top:2px}
  .pool-item.used{opacity:1;background:var(--paper2);border-color:var(--line);color:var(--dim)}
  .pool-item.used .no{color:var(--dim)}
  .pool-item.used::after{content:"已挂载";order:3;flex:0 0 auto;align-self:center;margin-left:auto;
                        font-size:10.5px;letter-spacing:.04em;color:var(--ok);
                        border:1px solid rgba(47,125,79,.26);background:rgba(47,125,79,.07);border-radius:999px;padding:1px 8px}
  .pool-item:not(.used):hover::after{content:"点挂";order:3;flex:0 0 auto;align-self:center;margin-left:auto;
                        font-size:10.5px;color:var(--accent);border:1px solid rgba(194,64,38,.3);
                        background:var(--card);border-radius:999px;padding:1px 8px}
  .pool-empty{font-size:12.5px;color:var(--dim);padding:16px 12px;line-height:1.8;
             border:1px dashed var(--line);border-radius:10px;background:var(--paper)}
  .pool-empty a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(194,64,38,.35)}

  /* ---------- 右栏：工具条 ---------- */
  .tree-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;
               padding-bottom:14px;border-bottom:1px solid var(--line)}
  #doc-title{background:var(--paper);border-radius:10px;padding:9px 13px;font-size:15px;font-weight:600;
            font-family:var(--serif);transition:background .15s ease,border-color .15s ease,box-shadow .15s ease}
  #doc-title:hover{border-color:var(--dim)}
  #doc-title:focus{background:var(--card);border-color:rgba(194,64,38,.45);box-shadow:0 0 0 3px rgba(194,64,38,.07)}
  #doc-title::placeholder{color:var(--dim);font-weight:400}
  .stat{font-size:11.5px;color:var(--dim);margin-left:auto;letter-spacing:.03em;white-space:nowrap;
        background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
  .stat b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
  .stat .miss{color:var(--bad)}

  /* ---------- 节点卡片 ---------- */
  #tree{display:flex;flex-direction:column;gap:12px}
  .node{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);
        box-shadow:var(--sh1);overflow:hidden;transition:border-color .16s ease,box-shadow .16s ease}
  .node:hover{box-shadow:var(--sh2)}
  .node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);z-index:1}
  .node.has::before{background:var(--ok)}
  .node.miss::before{background:var(--bad)}
  .node.sel{border-color:rgba(194,64,38,.5);box-shadow:0 0 0 3px rgba(194,64,38,.08),var(--sh2)}
  .node.sel::before{background:var(--accent)}
  .node-head{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 17px;cursor:pointer;
             transition:background .15s ease}
  .node-head:hover{background:var(--paper)}
  .node-head .lv{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink2);
                 background:var(--paper2);border-radius:5px;padding:2px 7px;flex:0 0 auto}
  .node.sel .node-head .lv{background:rgba(194,64,38,.1);color:var(--accent)}
  .node-head .t{flex:1;font-weight:600;font-size:14px;line-height:1.5}
  .node.sel .node-head .t{color:var(--deep)}
  .node-head .refs{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.02em;flex:0 0 auto}
  .node-head .badge-miss{font-size:10.5px;letter-spacing:.04em;color:var(--bad);flex:0 0 auto;
                         border:1px solid rgba(178,59,46,.28);background:rgba(178,59,46,.05);
                         border-radius:999px;padding:2px 8px}
  .node-body{padding:4px 17px 15px;display:none;background:var(--paper);border-top:1px solid var(--line)}
  .node.open .node-body{display:block}
  .node-body label{display:block;font-size:11px;font-weight:600;color:var(--ink2);margin:13px 0 5px;letter-spacing:.06em}
  .node-body label:first-child{margin-top:11px}
  .node-body input[type=text],.node-body textarea{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;font:13.5px/1.65 var(--serif);outline:none;color:var(--ink);background:var(--card);
    transition:border-color .15s ease,box-shadow .15s ease}
  .node-body input[type=text].node-title{font-size:14px;font-weight:600;padding:9px 12px}
  .node-body textarea{font-size:13px;line-height:1.75;resize:vertical}
  .node-body input::placeholder,.node-body textarea::placeholder{color:var(--dim);opacity:.8}
  .node-body input:focus,.node-body textarea:focus{border-color:rgba(194,64,38,.5);box-shadow:0 0 0 3px rgba(194,64,38,.08)}
  .refs-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .ref-chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;
            background:var(--card);color:var(--ink2);display:inline-flex;gap:6px;align-items:center;
            transition:border-color .15s ease}
  .ref-chip:hover{border-color:rgba(194,64,38,.4)}
  .ref-chip button{border:1px solid transparent;background:var(--paper2);color:var(--dim);cursor:pointer;
                   font-size:10px;width:17px;height:17px;line-height:1;border-radius:50%;padding:0;
                   display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease}
  .ref-chip button:hover{background:rgba(178,59,46,.12);border-color:rgba(178,59,46,.3);color:var(--bad)}

  /* 节点操作组：主操作 / 层级 / 危险 */
  .node-ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line)}
  .node-ops .btn.sm{background:var(--card)}
  .node-ops [data-op="child"],.node-ops [data-op="sibling"]{border-color:rgba(194,64,38,.32);color:var(--accent)}
  .node-ops [data-op="child"]:hover,.node-ops [data-op="sibling"]:hover{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
  .node-ops [data-op="indent"],.node-ops [data-op="outdent"]{background:var(--paper2);border-color:transparent;color:var(--ink2)}
  .node-ops [data-op="indent"]{margin-left:8px}
  .node-ops [data-op="indent"]:hover,.node-ops [data-op="outdent"]:hover{background:var(--card);border-color:var(--line);color:var(--ink)}
  .node-ops [data-op="del"]{margin-left:auto;background:var(--card);border-color:var(--line);color:var(--dim)}
  .node-ops [data-op="del"]:hover{background:rgba(178,59,46,.05);border-color:rgba(178,59,46,.45);color:var(--bad);box-shadow:none}

  /* ---------- 空态 / 页脚 / 导出区 ---------- */
  .empty{padding:44px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.9;
         border:1px dashed var(--line);border-radius:12px;background:var(--paper)}
  .foot{margin-top:30px;font-size:11.5px;color:var(--dim);letter-spacing:.03em;
        border-top:1px solid var(--line);padding-top:14px}
  #out-md{width:100%;min-height:180px;margin-top:14px;border:1px solid var(--line);border-radius:12px;
          padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.75;display:none;
          color:var(--ink2);background:var(--card);box-shadow:var(--sh1)}

  /* ---------- 弹窗 ---------- */
  .qz-modal{position:fixed;inset:0;background:rgba(21,24,29,.42);z-index:100;display:flex;
            align-items:center;justify-content:center;padding:20px;animation:qz-fade .18s ease-out}
  .qz-modal-card{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:720px;
                width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
                box-shadow:0 2px 8px rgba(21,24,29,.1),0 24px 60px rgba(21,24,29,.22);
                animation:qz-rise .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes qz-fade{from{opacity:0}}
  @keyframes qz-rise{from{opacity:0;transform:translateY(10px)}}
  .qz-modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;
                 padding:15px 20px;background:var(--paper);border-bottom:1px solid var(--line)}
  .qz-modal-head b{font-size:15px;letter-spacing:.02em}
  .qz-modal-head::after{content:"";position:absolute;left:20px;bottom:-1px;width:44px;height:2px;background:var(--accent)}
  .qz-modal-tip{padding:12px 20px;font-size:12.5px;color:var(--ink2);line-height:1.75;
                background:var(--hl);box-shadow:inset 3px 0 0 var(--hl-line);border-bottom:1px solid rgba(183,121,31,.22)}

  .rev-list{overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .rev-item{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid transparent;
            border-radius:10px;cursor:pointer;font-size:13px;line-height:1.55;
            transition:background .15s ease,border-color .15s ease}
  .rev-item:hover{background:var(--paper);border-color:var(--line)}
  .rev-item .no{font-family:var(--mono);color:var(--dim);flex:0 0 32px;font-size:11.5px;padding-top:2px}
  .rev-item .meta{color:var(--dim);font-size:11.5px;margin-top:3px}
  .rev-preset{background:var(--paper2);border-color:var(--line)}
  .rev-preset:hover{background:var(--hl);border-color:rgba(183,121,31,.35)}
  .rev-empty{padding:30px 20px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.8}
  .spin{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px;border-radius:50%;
        border:2px solid var(--line);border-top-color:var(--accent);animation:qz-spin .7s linear infinite}
  @keyframes qz-spin{to{transform:rotate(360deg)}}

  .dom-body{overflow:auto;padding:16px 20px 20px}
  .dom-fields{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:5px;
              background:var(--paper);border:1px solid var(--line);border-radius:999px}
  .dom-field{border:1px solid transparent;background:none;border-radius:999px;padding:6px 15px;font-size:12.5px;
             font-family:var(--serif);color:var(--ink2);cursor:pointer;transition:background .15s ease,color .15s ease}
  .dom-field:hover{background:var(--card);color:var(--accent)}
  .dom-field.on{background:var(--accent);border-color:var(--accent);color:#FFFFFF;font-weight:600;
                box-shadow:0 2px 8px rgba(194,64,38,.24)}
  .dom-list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
  .dom-sec{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);
           font-size:13px;transition:background .15s ease}
  .dom-sec:hover{background:var(--paper)}
  .dom-sec:last-child{border-bottom:0}
  .dom-sec .k{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:0 0 86px;letter-spacing:.02em}
  .dom-sec .bar{flex:1;height:7px;background:var(--paper2);border-radius:999px;overflow:hidden}
  .dom-sec .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--deep));
                  transition:width .3s ease}
  .dom-sec .pct{font-family:var(--mono);font-size:11.5px;color:var(--ink);flex:0 0 44px;text-align:right}
  .dom-sec .ch{font-family:var(--mono);font-size:11px;color:var(--dim);flex:0 0 96px;text-align:right}
  .dom-apply{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .dom-note{font-size:11.5px;color:var(--dim);flex:1;line-height:1.65}

  .cmp-body{overflow:auto;padding:16px 20px 20px;font-size:13px}
  .cmp-fieldsel{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;font-size:12.5px;
                color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
  .cmp-fieldsel select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:12.5px var(--serif);
                       background:var(--card);color:var(--ink);cursor:pointer}
  .cmp-sum{margin:0 0 12px;padding:12px 15px;font-size:13px;line-height:1.8;background:var(--hl);
          border-radius:10px;box-shadow:inset 3px 0 0 var(--hl-line)}
  .cmp-row{display:flex;align-items:flex-start;gap:11px;padding:11px 8px;border-bottom:1px solid var(--line);
           transition:background .15s ease}
  .cmp-row:hover{background:var(--paper)}
  .cmp-row:last-child{border-bottom:0}
  .cmp-ic{flex:0 0 22px;width:22px;height:22px;margin-top:1px;border-radius:50%;text-align:center;
          font-family:var(--mono);font-size:11.5px;font-weight:700;line-height:20px}
  .cmp-ic.ok{color:var(--ok);background:rgba(47,125,79,.09);border:1px solid rgba(47,125,79,.28)}
  .cmp-ic.miss{color:var(--bad);background:rgba(178,59,46,.06);border:1px solid rgba(178,59,46,.28)}
  .cmp-ic.extra{color:var(--warn);background:rgba(183,121,31,.09);border:1px solid rgba(183,121,31,.28)}
  .cmp-n{flex:1;line-height:1.45}
  .cmp-n .sub{display:block;font-size:11.5px;color:var(--dim);margin-top:4px}
  .cmp-pct{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:0 0 46px;text-align:right}

  @media(max-width:900px){
    .pool{max-height:none}
    header{align-items:flex-start}
    .stat{margin-left:0}
  }
  @media(max-width:760px){
    .wrap{padding:18px 14px 64px}
    h1{font-size:22px}
    .sub{max-width:none}
    .acts{flex-direction:column;align-items:stretch;gap:8px;width:100%}
    .act-group{width:100%;border-left:0;padding-left:0;padding-top:9px;border-top:1px solid var(--line)}
    .act-group:first-child{border-top:0;padding-top:0}
    .act-group .btn{display:block;width:100%}
    .act-new{order:-1}
    .qz-modal{padding:12px}
    .node-head{padding:11px 12px 11px 15px;gap:8px}
    .node-body{padding:2px 14px 13px}
    .node-ops [data-op="del"]{margin-left:0}
    .node-ops [data-op="indent"]{margin-left:0}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>大纲树</h1>
      <div class="sub">自己搭骨架，每个节点挂证据；工具只负责告诉你哪个节点在空转</div>
      <div class="sub" id="srcLine" style="display:none;margin-top:5px"></div>
    </div>
    <div class="acts">
      <div class="act-group act-build">
        <button class="btn" id="btn-reverse">从论文反推大纲</button>
        <button class="btn" id="btn-domain">看领域标准骨架</button>
        <button class="btn" id="btn-pool">从综述台导入文献</button>
      </div>
      <div class="act-group act-audit">
        <button class="btn" id="btn-check">检查缺证据</button>
        <button class="btn" id="btn-compare">对比领域惯例</button>
      </div>
      <div class="act-group act-export">
        <button class="btn" id="btn-md">导出大纲 Markdown</button>
        <button class="btn" id="btn-json">导出 JSON</button>
      </div>
      <div class="act-group act-new">
        <button class="btn primary" id="btn-add">＋ 新增节点</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <div class="panel">
      <h2>文献池 <span id="pool-count" style="font-weight:400">0</span></h2>
      <div class="pool" id="pool"></div>
    </div>

    <div class="panel">
      <div class="tree-toolbar">
        <input id="doc-title" placeholder="选题标题，例如：扩散模型在视频超分中的可行性" style="flex:1;min-width:240px;border:1px solid var(--line);outline:none">
        <span class="stat" id="stat">—</span>
      </div>
      <div id="tree"></div>
      <textarea id="out-md" readonly></textarea>
    </div>
  </div>

  <div class="foot">
    群智 · 大纲树 ｜ 数据存在本浏览器（localStorage），导出的 JSON 可备份/迁移｜
    <span style="font-family:var(--mono)">本地优先，不上传</span>
  </div>
</div>

<div class="qz-modal" id="rev-modal" style="display:none">
  <div class="qz-modal-card">
    <div class="qz-modal-head">
      <b>从论文反推大纲</b>
      <button class="btn sm" id="rev-close">关闭</button>
    </div>
    <div class="qz-modal-tip">选一篇论文，按它真实的章节结构生成大纲骨架；每章挂上该论文原文当依据，可以照着改。</div>
    <div class="rev-list" id="rev-list"></div>
  </div>
</div>


<div class="qz-modal" id="dom-modal" style="display:none">
  <div class="qz-modal-card">
    <div class="qz-modal-head">
      <b>领域标准骨架</b>
      <button class="btn sm" id="dom-close">关闭</button>
    </div>
    <div class="qz-modal-tip">
      从库里真实论文批量反推出来的章节结构（每领域 20 篇，纯规则统计，可复算）。
      点「用这个骨架」会把章节变成节点，每章注明该领域的常见程度。
    </div>
    <div class="dom-body" id="dom-body"></div>
  </div>

<div class="qz-modal" id="cmp-modal" style="display:none">
  <div class="qz-modal-card">
    <div class="qz-modal-head">
      <b>对比领域惯例</b>
      <button class="btn sm" id="cmp-close">关闭</button>
    </div>
    <div class="cmp-body" id="cmp-body"></div>
  </div>
</div>

<script>
(function () {
  var LS_TREE = "qunzhi.outline.v1";
  var LS_REFS = "reviewbench.v1";     // 综述台的文献库（同域共享）
  var KEY = "__QZ_DEMO_KEY__";

  var state = { title: "", nodes: [], pool: [], selId: null, seed: 1 };

  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function newId() { state.seed += 1; return "n" + Date.now().toString(36) + state.seed; }

  /* ---------- 持久化 ---------- */
  function save() {
    try {
      localStorage.setItem(LS_TREE, JSON.stringify({
        title: state.title, nodes: state.nodes, pool: state.pool, seed: state.seed
      }));
    } catch (e) {}
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(LS_TREE) || "null");
      if (!d) return;
      state.title = d.title || "";
      state.nodes = d.nodes || [];
      state.pool = d.pool || [];
      state.seed = d.seed || 1;
    } catch (e) {}
  }

  /* ---------- 文献池 ---------- */
  var poolLoading = false;

  function loadPool(silent) {
    var pool = [];
    try {
      var rb = JSON.parse(localStorage.getItem(LS_REFS) || "null");
      if (rb && Array.isArray(rb.items)) {
        rb.items.forEach(function (it, i) {
          pool.push({ id: it.id || ("r" + i), title: it.title || "", year: it.year || null, src: "reviewbench" });
        });
      }
    } catch (e) {}
    mergePool(pool);

    // 本地没有 → 自己去拉本周论文（不等用户先去综述台）
    if (!state.pool.length && !poolLoading) {
      poolLoading = true;
      $("#pool").innerHTML = '<div class="pool-empty">正在取本周论文…</div>';
      fetch("/api/weekly/export?format=json&n=15", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var arr = (j.items || []).map(function (x, i) {
            return { id: x.pid || ("w" + i), title: x.title || "", year: x.year || null, src: "weekly" };
          });
          // QBUG-015：先结束 loading 再 renderPool，否则同步的空态会把
          // 「正在取本周论文…」覆盖掉；成功/失败都要走同一个收尾。
          poolLoading = false;
          mergePool(arr); save(); renderPool();
          if (!state.pool.length && !silent) {
            $("#pool").innerHTML = '<div class="pool-empty">暂时没取到论文。<br>可以先点「＋ 新增节点」直接搭架子，文献之后再挂。</div>';
          }
        })
        .catch(function () {
          poolLoading = false;
          $("#pool").innerHTML = '<div class="pool-empty">取本周论文失败（可能断网）。<br>可以先「＋ 新增节点」搭架子。</div>';
          $("#pool-count").textContent = "0";
        });
      // 关键：不要在 fetch 返回前落到下面的 save()/renderPool()，
      // 那一行会把加载提示立刻覆写成空态（QBUG-015）。
      return;
    }
    save();
    renderPool();
  }

  function mergePool(arr) {
    var seen = {};
    state.pool.forEach(function (p) { seen[p.id] = p; });
    arr.forEach(function (p) { if (!seen[p.id]) seen[p.id] = p; });
    state.pool = Object.keys(seen).map(function (k) { return seen[k]; });
  }

  function renderPool() {
    var box = $("#pool");
    // 还在拉本周论文时不要用空态覆盖加载提示
    if (poolLoading && !state.pool.length) { $("#pool-count").textContent = "…"; return; }
    if (!state.pool.length) {
      box.innerHTML = '<div class="pool-empty">还没有文献。<br>先去 <a href="/reviewbench/" target="_blank" rel="noopener">综述台</a> 加载本周必读，回来点「从综述台导入文献」。</div>';
      $("#pool-count").textContent = "0";
      return;
    }
    $("#pool-count").textContent = String(state.pool.length);
    box.innerHTML = state.pool.map(function (p, i) {
      var used = state.nodes.some(function (n) { return (n.refs || []).indexOf(p.id) >= 0; });
      return '<div class="pool-item' + (used ? " used" : "") + '" data-ref="' + esc(p.id) + '" title="点一下挂到当前节点">' +
        '<span class="no">[' + (i + 1) + ']</span><span>' + esc(p.title) + (p.year ? ' <span style="color:var(--dim)">' + p.year + '</span>' : '') + '</span></div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-ref]"), function (el) {
      el.onclick = function () { attachRef(el.getAttribute("data-ref")); };
    });
  }

  function refLabel(id) {
    var i = state.pool.findIndex(function (p) { return p.id === id; });
    return i >= 0 ? "[" + (i + 1) + "]" : "[?]";
  }
  function refTitle(id) {
    var p = state.pool.find(function (x) { return x.id === id; });
    return p ? p.title : id;
  }

  /* ---------- 节点操作 ---------- */

  /* 示例树：让新用户 3 秒看到"这工具长什么样" */
  function buildDemoTree() {
    if (!state.pool.length) {
      alert("文献池还是空的，先等它取到本周论文，或点「＋ 新增节点」自己搭");
      return;
    }
    var r = state.pool.map(function (p) { return p.id; });
    var mk = function (level, title, points, refs) {
      return { id: newId(), level: level, title: title, points: points || "", refs: refs || [], open: level === 1 };
    };
    state.title = state.title || "（示例）选题标题：把你想做的事写成一句话";
    state.nodes = [
      mk(1, "第 1 节 研究现状与共同假设", "- 现有方法都建立在什么前提上\n- 这些前提在我们的场景成立吗", [r[0]]),
      mk(2, "1.1 现有方法的共同假设", "- 数据分布一致\n- 训练/测试同源", [r[1] || r[0]]),
      mk(2, "1.2 哪些假设在我们的场景会失效", "（这里故意不挂文献，看看工具怎么提示你）", []),
      mk(1, "第 2 节 我们的方法", "- 关键差异点\n- 为什么这个差异重要", [r[2] || r[0]]),
      mk(2, "2.1 预期效果与验证计划", "- 要测什么、比什么、怎么算过关", [])
    ];
    state.selId = state.nodes[0].id;
    save(); render();
  }

  function addNode(afterId, asChild) {
    var base = afterId ? state.nodes.findIndex(function (n) { return n.id === afterId; }) : -1;
    var level = 1;
    if (base >= 0) level = Math.min(3, (state.nodes[base].level || 1) + (asChild ? 1 : 0));
    var node = { id: newId(), level: level, title: "", points: "", refs: [], open: true };
    if (base >= 0) state.nodes.splice(base + 1, 0, node);
    else state.nodes.push(node);
    state.selId = node.id;
    save(); render();
    var el = document.querySelector('[data-node="' + node.id + '"] input.node-title');
    if (el) el.focus();
  }

  function delNode(id) {
    var i = state.nodes.findIndex(function (n) { return n.id === id; });
    if (i < 0) return;
    var lv = state.nodes[i].level || 1;
    var j = i + 1;
    while (j < state.nodes.length && (state.nodes[j].level || 1) > lv) j++;
    state.nodes.splice(i, j - i);
    if (state.selId === id) state.selId = null;
    save(); render();
  }

  function indent(id, dir) {
    var n = state.nodes.find(function (x) { return x.id === id; });
    if (!n) return;
    n.level = Math.max(1, Math.min(3, (n.level || 1) + dir));
    save(); render();
  }

  function attachRef(refId) {
    if (!state.selId) { alert("先在右侧点选一个节点，再点文献挂上去"); return; }
    var n = state.nodes.find(function (x) { return x.id === state.selId; });
    if (!n) return;
    n.refs = n.refs || [];
    if (n.refs.indexOf(refId) < 0) n.refs.push(refId);
    save(); render();
  }

  function detachRef(id, refId) {
    var n = state.nodes.find(function (x) { return x.id === id; });
    if (!n) return;
    n.refs = (n.refs || []).filter(function (x) { return x !== refId; });
    save(); render();
  }

  /* ---------- 渲染 ---------- */
  function render() {
    $("#doc-title").value = state.title || "";
    var tree = $("#tree");
    if (!state.nodes.length) {
      tree.innerHTML = '<div class="empty">还没有节点。<br>点右上「＋ 新增节点」开始搭，或者<br>' +
        '<button class="btn" id="btn-demo-tree" style="margin-top:10px">用示例搭一个（3 层 5 节点）</button>' +
        '<div style="margin-top:12px;color:var(--dim);font-size:12px">每个论点都该能挂上至少一篇文献；挂不上的，就是你要补的功课。</div></div>';
      var db = document.getElementById("btn-demo-tree");
      if (db) db.onclick = buildDemoTree;
      updateStat();
      return;
    }
    tree.innerHTML = state.nodes.map(function (n) {
      var refs = n.refs || [];
      var has = refs.length > 0;
      var cls = "node" + (state.selId === n.id ? " sel" : "") + (has ? " has" : " miss") + (n.open ? " open" : "");
      return '<div class="' + cls + '" data-node="' + n.id + '">' +
        '<div class="node-head" data-head="' + n.id + '">' +
          '<span class="lv">L' + (n.level || 1) + '</span>' +
          '<span class="t">' + (esc(n.title) || '<span style="color:var(--dim)">（未命名节点）</span>') + '</span>' +
          (has ? '<span class="refs">' + refs.map(refLabel).join("") + '</span>' : '<span class="badge-miss">缺证据</span>') +
        '</div>' +
        '<div class="node-body">' +
          '<label>节点标题</label>' +
          '<input type="text" class="node-title" data-f="title" data-id="' + n.id + '" value="' + esc(n.title) + '" placeholder="例如：1.2 现有方法的共同假设">' +
          '<label>这一节要讲什么（要点，一行一条）</label>' +
          '<textarea rows="2" data-f="points" data-id="' + n.id + '" placeholder="- 要点一&#10;- 要点二">' + esc(n.points) + '</textarea>' +
          '<label>挂载文献' + (has ? "（" + refs.length + " 篇）" : "（空 = 缺证据）") + '</label>' +
          '<div class="refs-list">' + (refs.length ? refs.map(function (r) {
            return '<span class="ref-chip">' + refLabel(r) + ' ' + esc(refTitle(r).slice(0, 26)) +
              '<button data-detach="' + n.id + '" data-ref="' + esc(r) + '" title="移除">✕</button></span>';
          }).join("") : '<span style="font-size:12px;color:var(--bad)">还没有挂文献 —— 点左侧文献池任意一篇挂上</span>') + '</div>' +
          '<div class="node-ops">' +
            '<button class="btn sm" data-op="child" data-id="' + n.id + '">＋ 子节点</button>' +
            '<button class="btn sm" data-op="sibling" data-id="' + n.id + '">＋ 同级</button>' +
            '<button class="btn sm" data-op="indent" data-id="' + n.id + '">→ 降级</button>' +
            '<button class="btn sm" data-op="outdent" data-id="' + n.id + '">← 升级</button>' +
            '<button class="btn sm" data-op="del" data-id="' + n.id + '">删除</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join("");
    bind();
    updateStat();
  }

  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-head]"), function (h) {
      h.onclick = function () {
        var id = h.getAttribute("data-head");
        var n = state.nodes.find(function (x) { return x.id === id; });
        if (!n) return;
        state.selId = id;
        n.open = !n.open;
        save(); render();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-f]"), function (el) {
      el.oninput = function () {
        var n = state.nodes.find(function (x) { return x.id === el.getAttribute("data-id"); });
        if (!n) return;
        n[el.getAttribute("data-f")] = el.value;
        save();
        // 只更新标题显示，避免重渲染丢焦点
        if (el.getAttribute("data-f") === "title") {
          var card = el.closest("[data-node]");
          var t = card && card.querySelector(".node-head .t");
          if (t) t.innerHTML = esc(el.value) || '<span style="color:var(--dim)">（未命名节点）</span>';
        }
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-detach]"), function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        detachRef(b.getAttribute("data-detach"), b.getAttribute("data-ref"));
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-op]"), function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var id = b.getAttribute("data-id");
        var op = b.getAttribute("data-op");
        if (op === "child") addNode(id, true);
        else if (op === "sibling") addNode(id, false);
        else if (op === "indent") indent(id, 1);
        else if (op === "outdent") indent(id, -1);
        else if (op === "del") { if (confirm("删除这个节点（含子节点）？")) delNode(id); }
      };
    });
  }

  function updateStat() {
    var total = state.nodes.length;
    var miss = state.nodes.filter(function (n) { return !(n.refs || []).length; }).length;
    $("#stat").innerHTML = total
      ? '节点 <b>' + total + '</b> ｜ 缺证据 <b class="miss">' + miss + '</b> ｜ 覆盖 <b>' + Math.round((total - miss) / total * 100) + '%</b>'
      : '—';
  }

  /* ---------- 导出 ---------- */
  function toMarkdown() {
    var lines = ["# " + (state.title || "未命名选题"), ""];
    state.nodes.forEach(function (n) {
      var pad = "  ".repeat(Math.max(0, (n.level || 1) - 1));
      lines.push(pad + "- " + (n.title || "（未命名）") + ((n.refs || []).length ? " " + n.refs.map(refLabel).join("") : " ⚠（缺证据）"));
      if (n.points) {
        n.points.split("\n").filter(Boolean).forEach(function (p) { lines.push(pad + "  " + p.trim()); });
      }
    });
    lines.push("", "## 文献");
    state.pool.forEach(function (p, i) { lines.push("[" + (i + 1) + "] " + p.title + (p.year ? "（" + p.year + "）" : "")); });
    return lines.join("\n");
  }

  function checkMissing() {
    var miss = state.nodes.filter(function (n) { return !(n.refs || []).length; });
    if (!miss.length) { alert("全部 " + state.nodes.length + " 个节点都有证据 ✅"); return; }
    alert("缺证据的节点（" + miss.length + " 个）：\n\n" + miss.map(function (n, i) {
      return (i + 1) + ". " + (n.title || "（未命名）") + "（L" + (n.level || 1) + "）";
    }).join("\n"));
  }

  /* ---------- 事件 ---------- */

  /* 从论文反推大纲 2026-11-19 */
  (function () {
    var btn = document.getElementById("btn-reverse");
    var modal = document.getElementById("rev-modal");
    var list = document.getElementById("rev-list");
    var closeBtn = document.getElementById("rev-close");
    if (!btn || !modal) return;

    function openModal() {
      modal.style.display = "flex";
      if (!state.pool.length) {
        list.innerHTML = '<div class="rev-empty">文献池还是空的，等它取到本周论文后再试。</div>';
        return;
      }
      // A. 推荐模板：领域/章节数不再写死（QBUG-018），打开弹窗时按
      // /api/paper/<pid>/outline 的实测 field + sections.length 回填。
      var PRESETS = [
        { id: "ax_2510.26996", t: "MoME" },
        { id: "ax_2511.13007", t: "GEM" },
        { id: "ax_2507.19027", t: "SESR-Eval" }
      ];
      var html = '<div style="padding:2px 10px 6px;font-size:11.5px;color:#8A8579">推荐模板（领域/章数以接口实测显示，点击后按全文反推）</div>';
      html += PRESETS.map(function (p, i) {
        return '<div class="rev-item rev-preset" data-rev="' + p.id + '" data-preset="' + p.id + '">' +
          '<span class="no">T' + (i + 1) + '</span>' +
          '<span><div><b class="rev-pt">' + esc(p.t) + '</b></div>' +
          '<div class="meta rev-pm" data-pm="' + p.id + '">读取接口实测中…</div></span></div>';
      }).join("");
      // 异步回填真实领域与章数；失败就明确标“未取到”，不再用假数据
      PRESETS.forEach(function (p) {
        fetch("/api/paper/" + encodeURIComponent(p.id) + "/outline", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            var pm = list.querySelector('[data-pm="' + p.id + '"]');
            var pt = list.querySelector('[data-preset="' + p.id + '"] .rev-pt');
            if (!j || !j.ok) { if (pm) pm.textContent = "接口未返回结构（仍可点击尝试）"; return; }
            var secs = (j.sections || []).length;
            if (pt && j.title) pt.textContent = j.title;
            if (pm) pm.textContent = (j.field || "领域未知") + " · " + secs + " 章（接口实测）";
          })
          .catch(function () {
            var pm = list.querySelector('[data-pm="' + p.id + '"]');
            if (pm) pm.textContent = "接口读取失败（仍可点击尝试）";
          });
      });
      html += '<div style="padding:12px 10px 6px;font-size:11.5px;color:#8A8579;border-top:1px solid var(--line);margin-top:8px">或从你的文献池里选（新论文的全文可能不全，失败就换一篇）</div>';
      html += state.pool.map(function (p, i) {
        return '<div class="rev-item" data-rev="' + esc(p.id) + '">' +
          '<span class="no">[' + (i + 1) + ']</span>' +
          '<span><div>' + esc(p.title) + '</div>' +
          '<div class="meta">' + (p.year || "-") + ' ｜ 点它按这篇的结构生成大纲</div></span></div>';
      }).join("");
      list.innerHTML = html;
      Array.prototype.forEach.call(list.querySelectorAll("[data-rev]"), function (el) {
        el.onclick = function () { doReverse(el.getAttribute("data-rev")); };
      });
    }

    function doReverse(pid) {
      list.innerHTML = '<div class="rev-empty"><span class="spin"></span> 正在从全文拆解章节结构…</div>';
      fetch("/api/paper/" + encodeURIComponent(pid) + "/outline", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.detail || "反推失败");
          if (!j.sections || !j.sections.length) throw new Error("这篇的结构没识别出来，换一篇试试");
          build(j);
          modal.style.display = "none";
        })
        .catch(function (e) {
          list.innerHTML = '<div class="rev-empty" style="color:#B23B2E">' + esc(e.message || String(e)) +
            '<br><br>不是所有论文都能反推（老论文、书章格式常失败），换一篇 2024 年后的会议论文试试。</div>';
        });
    }

    function build(j) {
      var keep = j.sections.filter(function (x) { return x.kind !== "refs"; });
      if (!keep.length) { list.innerHTML = '<div class="rev-empty">只有参考文献，没法当模板</div>'; return; }
      if (!state.pool.some(function (p) { return p.id === j.pid; })) {
        state.pool.unshift({ id: j.pid, title: j.title || j.pid, year: j.year || null, src: "reverse" });
      }
      state.nodes = keep.map(function (x) {
        return {
          id: newId(), level: 1,
          title: x.title || x.kind,
          points: x.first ? ("- " + x.first) : "",
          refs: [j.pid],
          open: false
        };
      });
      state.title = (j.title ? ("（模板）" + j.title) : state.title);
      state.selId = state.nodes.length ? state.nodes[0].id : null;
      save(); renderPool(); render();
    }

    btn.onclick = openModal;
    if (closeBtn) closeBtn.onclick = function () { modal.style.display = "none"; };
    modal.addEventListener("click", function (e) { if (e.target === modal) modal.style.display = "none"; });
  })();


  /* 领域标准骨架（2026-11-19） */
  (function () {
    var btn = document.getElementById("btn-domain");
    var modal = document.getElementById("dom-modal");
    var body = document.getElementById("dom-body");
    var closeBtn = document.getElementById("dom-close");
    if (!btn || !modal) return;
    var cur = null, curField = "";

    function openModal() {
      modal.style.display = "flex";
      body.innerHTML = '<div class="rev-empty"><span class="spin"></span> 读取模板库…</div>';
      fetch("/api/outline/templates", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.detail || "读取失败");
          renderFields(j);
        })
        .catch(function (e) {
          body.innerHTML = '<div class="rev-empty" style="color:#B23B2E">' + esc(e.message) + '</div>';
        });
    }

    function renderFields(j) {
      var fields = Object.keys(j.fields || {});
      if (!fields.length) { body.innerHTML = '<div class="rev-empty">模板库是空的</div>'; return; }
      body.innerHTML = '<div class="dom-fields">' + fields.map(function (f, i) {
        return '<button class="dom-field' + (i === 0 ? " on" : "") + '" data-f="' + esc(f) + '">' + esc(f) + '</button>';
      }).join("") + '</div><div id="dom-detail"></div>';
      Array.prototype.forEach.call(body.querySelectorAll("[data-f]"), function (el) {
        el.onclick = function () {
          Array.prototype.forEach.call(body.querySelectorAll("[data-f]"), function (x) { x.classList.remove("on"); });
          el.classList.add("on");
          loadField(el.getAttribute("data-f"));
        };
      });
      loadField(fields[0]);
    }

    function loadField(f) {
      var det = document.getElementById("dom-detail");
      det.innerHTML = '<div class="rev-empty"><span class="spin"></span> 读取 ' + esc(f) + '…</div>';
      fetch("/api/outline/templates?field=" + encodeURIComponent(f), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.detail || "读取失败");
          cur = j; curField = f;
          var list = (j.sections || []).map(function (s) {
            var pct = Math.round((s.freq || 0) * 100);
            return '<li class="dom-sec"><span class="k">' + esc(s.kind) + '</span>' +
              '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
              '<span class="pct">' + pct + '%</span>' +
              '<span class="ch">中位 ' + (s.median_chars || 0).toLocaleString() + ' 字</span></li>';
          }).join("");
          det.innerHTML = '<div style="font-size:12px;color:#8A8579;margin:0 0 8px">' + esc(f) + ' · ' + (j.n || 0) + ' 篇样本</div>' +
            '<ul class="dom-list">' + list + '</ul>' +
            '<div class="dom-apply"><button class="btn primary" id="dom-apply">用这个骨架</button>' +
            '<span class="dom-note">生成的节点会注明「该领域 N% 的论文有这一章」，你可以按需删减。</span></div>';
          document.getElementById("dom-apply").onclick = applySkeleton;
        })
        .catch(function (e) {
          det.innerHTML = '<div class="rev-empty" style="color:#B23B2E">' + esc(e.message) + '</div>';
        });
    }

    function applySkeleton() {
      if (!cur || !cur.sections) return;
      var order = ["abstract", "intro", "related", "method", "experiment", "discussion", "conclusion"];
      var secs = cur.sections.filter(function (s) { return s.kind !== "refs"; })
        .sort(function (a, b) { return order.indexOf(a.kind) - order.indexOf(b.kind); });
      state.nodes = secs.map(function (s) {
        var pct = Math.round((s.freq || 0) * 100);
        return {
          id: newId(), level: 1,
          title: s.kind + "（" + curField + " " + pct + "% 的论文有）",
          points: "- 该领域 " + pct + "% 的论文有这一章；中位篇幅 " + (s.median_chars || 0).toLocaleString() + " 字",
          refs: [],
          open: false
        };
      });
      try { localStorage.setItem("qunzhi.outline.lastField", curField); } catch (e) {}
      if (!state.title) state.title = "（骨架）" + curField + " 论文标准结构";
      state.selId = state.nodes.length ? state.nodes[0].id : null;
      save(); render();
      modal.style.display = "none";
    }

    btn.onclick = openModal;
    if (closeBtn) closeBtn.onclick = function () { modal.style.display = "none"; };
    modal.addEventListener("click", function (e) { if (e.target === modal) modal.style.display = "none"; });
  })();


  /* 对比领域惯例 2026-11-19 */
  (function () {
    var btn = document.getElementById("btn-compare");
    var modal = document.getElementById("cmp-modal");
    var body = document.getElementById("cmp-body");
    var closeBtn = document.getElementById("cmp-close");
    if (!btn || !modal) return;

    var KIND_RULES = [
      ["abstract", /abstract|摘要/i],
      ["intro", /intro|引言|绪论|导论/i],
      ["related", /related|background|相关工作|背景/i],
      ["method", /method|approach|方法|模型|框架|算法/i],
      ["experiment", /experiment|evaluation|实验|评估|结果|基准/i],
      ["discussion", /discussion|analysis|ablation|讨论|分析|消融/i],
      ["conclusion", /conclusion|summary|结论|总结/i]
    ];

    function kindOf(node) {
      var t = (node.title || "") + " " + (node.points || "");
      for (var i = 0; i < KIND_RULES.length; i++) {
        if (KIND_RULES[i][1].test(t)) return KIND_RULES[i][0];
      }
      return null;
    }

    function openModal() {
      if (!state.nodes.length) { alert("先把大纲搭起来（或从模板生成），再来对比"); return; }
      modal.style.display = "flex";
      body.innerHTML = '<div class="rev-empty"><span class="spin"></span> 读取领域惯例…</div>';
      fetch("/api/outline/templates", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.detail || "读取失败");
          var fields = Object.keys(j.fields || {});
          var last = "";
          try { last = localStorage.getItem("qunzhi.outline.lastField") || ""; } catch (e) {}
          var def = (last && fields.indexOf(last) >= 0) ? last : fields[0];
          body.innerHTML = '<div class="cmp-fieldsel"><span>对比领域：</span><select id="cmp-f">' +
            fields.map(function (f) {
              return '<option' + (f === def ? ' selected' : '') + '>' + esc(f) + '</option>';
            }).join("") +
            '</select><span style="color:#8A8579">（默认用你刚生成骨架的领域）</span></div><div id="cmp-res"></div>';
          document.getElementById("cmp-f").onchange = function () { compare(this.value); };
          compare(def);
        })
        .catch(function (e) {
          body.innerHTML = '<div class="rev-empty" style="color:#B23B2E">' + esc(e.message) + '</div>';
        });
    }

    function compare(f) {
      var res = document.getElementById("cmp-res");
      res.innerHTML = '<div class="rev-empty"><span class="spin"></span> 对比中…</div>';
      fetch("/api/outline/templates?field=" + encodeURIComponent(f), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error(j.detail || "读取失败");
          var tpl = (j.sections || []).filter(function (s) { return s.kind !== "refs"; });
          var mine = {};
          state.nodes.forEach(function (n) {
            var k = kindOf(n);
            if (k) mine[k] = (mine[k] || 0) + 1;
          });
          var rows = [], okN = 0, missN = 0, missList = [];
          tpl.forEach(function (s) {
            var pct = Math.round((s.freq || 0) * 100);
            var has = !!mine[s.kind];
            if (has) okN++; else { missN++; missList.push(s.kind); }
            rows.push('<div class="cmp-row">' +
              '<span class="cmp-ic ' + (has ? "ok" : "miss") + '">' + (has ? "✓" : "✕") + '</span>' +
              '<span class="cmp-n">' + esc(s.kind) + (has ? '（你有 ' + mine[s.kind] + ' 个节点）' : '（你的树里没有）') +
              '<span class="sub">' + esc(f) + ' 领域 ' + pct + '% 的论文有这一章，中位 ' + (s.median_chars || 0).toLocaleString() + ' 字</span></span>' +
              '<span class="cmp-pct">' + pct + '%</span></div>');
          });
          Object.keys(mine).forEach(function (k) {
            if (!tpl.some(function (s) { return s.kind === k; })) {
              rows.push('<div class="cmp-row">' +
                '<span class="cmp-ic extra">+</span>' +
                '<span class="cmp-n">' + esc(k) + '（你有 ' + mine[k] + ' 个，领域模板里没有这一章）' +
                '<span class="sub">不一定是坏事——可能是领域特有结构</span></span>' +
                '<span class="cmp-pct">—</span></div>');
            }
          });
          var total = tpl.length;
          var pctCover = total ? Math.round((okN / total) * 100) : 0;
          var sum = '<div class="cmp-sum"><b>' + esc(f) + ' 惯例覆盖 ' + pctCover + '%</b>（' + okN + '/' + total + ' 章对上' +
            (missN ? '，<span style="color:#B23B2E">缺 ' + esc(missList.join("、")) + '</span>' : '，全齐 ✓') + '）</div>' +
            '<div style="font-size:11.5px;color:#8A8579;margin-bottom:10px">按节点标题关键词匹配；未匹配的节点不计入</div>';
          res.innerHTML = sum + rows.join("");
        })
        .catch(function (e) {
          res.innerHTML = '<div class="rev-empty" style="color:#B23B2E">' + esc(e.message) + '</div>';
        });
    }

    btn.onclick = openModal;
    if (closeBtn) closeBtn.onclick = function () { modal.style.display = "none"; };
    modal.addEventListener("click", function (e) { if (e.target === modal) modal.style.display = "none"; });
  })();

  $("#btn-add").onclick = function () { addNode(state.selId, false); };
  $("#btn-pool").onclick = function () { loadPool(); };
  $("#btn-check").onclick = checkMissing;
  $("#btn-md").onclick = function () {
    var ta = $("#out-md");
    var show = ta.style.display !== "block";
    ta.style.display = show ? "block" : "none";
    if (show) { ta.value = toMarkdown(); ta.scrollIntoView({ block: "center" }); }
  };
  $("#btn-json").onclick = function () {
    var blob = new Blob([JSON.stringify({ title: state.title, nodes: state.nodes, pool: state.pool }, null, 1)],
      { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "outline-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
  };
  $("#doc-title").oninput = function () { state.title = this.value; save(); };

  /* ---------- 启动 ---------- */
  load();
  // URL 状态：?topic=选题（线 4 带过来）、?pid=论文（线 1/3 带过来）、?line=业务线
  var _q = new URLSearchParams(location.search);
  var _topic = _q.get("topic") || "";
  var _pid = _q.get("pid") || "";
  var _line = _q.get("line") || (_topic ? "4" : "1");
  if (_topic) { state.title = _topic; }
  if (_pid) {
    var _src = document.getElementById("srcLine");
    if (_src) {
      _src.style.display = "";
      _src.innerHTML = '来自论文 <a href="/read?pid=' + encodeURIComponent(_pid) +
        '&line=' + encodeURIComponent(_line) + '">' + esc(_pid) + '</a> · 每个节点都可以挂这篇论文的章节当证据';
    }
  }
  loadPool();
  render();
  if (window.QZNav) { window.QZNav.refresh(); if (_topic) window.QZNav.setTitle(_topic); }
})();
</script>


<script src="/static/qz-nav.js"></script>
