<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>群智 · 管理控制台</title>
<style>
  :root{--ink:#15181D;--ink2:#4A5158;--dim:#8A9099;--line:#E6E1D8;--paper:#FAF6F0;--card:#fff;
        --accent:#C2402B;--ok:#2F7D5A;--bad:#B3261E;--mono:"JetBrains Mono",Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
       padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800}
  .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
  .top .links a{color:var(--ink2);text-decoration:none;margin-left:16px;font-size:13px}
  .top .links a:hover{color:var(--accent)}
  .wrap{max-width:1160px;margin:0 auto;padding:18px 20px 60px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
       border-radius:12px;padding:12px 14px}
  .bar input{flex:1;min-width:200px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13.5px}
  .btn:hover{border-color:#cfc7ba}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.danger{color:var(--bad);border-color:#e7c9c4}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .tabs{display:flex;gap:4px;margin:16px 0 14px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:13.5px}
  .tab.on{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600}
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.15fr .85fr}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .kpi .l{font-size:12px;color:var(--dim)}
  .kpi .v{font-family:var(--mono);font-size:24px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
  .kpi .s{font-size:11.5px;color:var(--dim);margin-top:3px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h3{margin:0 0 12px;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-size:11.5px;font-weight:600;padding:6px 5px;border-bottom:1px solid var(--line)}
  td{padding:8px 5px;border-bottom:1px solid #f3efe8;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .on{background:var(--ok)}.off{background:var(--bad)}
  .pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);background:#faf7f1}
  .pill.ok{color:var(--ok);border-color:#cfe3d8;background:#f2f9f5}
  .pill.bad{color:var(--bad);border-color:#efd2cc;background:#fdf4f2}
  .bars{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:130px;margin-top:8px}
  .bars .b{flex:0 0 auto;width:48px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  .bars .bn{font-size:11.5px;color:var(--dim)}
  .bars .bx{width:100%;background:linear-gradient(180deg,#e0a595,#C2402B);border-radius:5px 5px 0 0;min-height:2px}
  .bars .bl{font-size:11.5px;color:var(--dim)}
  .muted{color:var(--dim);font-size:12px}
  code{font-family:var(--mono);font-size:12px;background:#f6f2ea;border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .form{display:grid;grid-template-columns:1.4fr .7fr .7fr auto;gap:8px;align-items:end}
  .form label{font-size:11.5px;color:var(--dim);display:block;margin-bottom:4px}
  .form input,.form select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  #newkey{display:none;background:#fffbe8;border:1px solid #f0e3b0;border-radius:10px;padding:12px 14px;margin-top:10px}
  #newkey code{font-size:13px;word-break:break-all;background:#fff}
  #msg{font-size:12.5px;color:var(--dim)}
  @media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
    .form{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="mark">群</span>群智 · 管理控制台</div>
  <div class="links">
    <a href="/portal">用户端</a><a href="/workbench">工作台</a><a href="/pkg">包审查</a><a href="/eval">评测</a>
  </div>
</div>

<div class="wrap">
  <div class="bar">
    <input id="k" type="password" placeholder="输入管理 key（仅本地保存）">
    <button class="btn primary" onclick="reload()">刷新</button>
    <span id="who" style="font-size:12.5px;color:var(--dim)"></span>
    <span id="msg"></span>
  </div>
  <div style="margin:-4px 0 12px;padding:9px 12px;border:1px dashed var(--line);border-radius:9px;
              background:var(--paper-2);font-size:12px;color:var(--dim);line-height:1.7">
    管理 key 与用户 key 不同：页面内置的是演示 key（限额 1000/天，由服务端
    <code>QZ_DEMO_KEY</code> 配置），调 <code>/api/admin/*</code> 会 401。
    管理台改用 <code>X-QunZhi-Admin</code> 请求头或 <code>?admin_key=</code>，由平台管理员在服务端
    <code>QZ_ADMIN_KEY</code> 配置（管理 key 不在此页展示）。401 = key 不对，不是系统故障。
  </div>

  <div class="tabs">
    <div class="tab on" data-t="overview" onclick="go('overview')">概览</div>
    <div class="tab" data-t="keys" onclick="go('keys')">Key 管理</div>
    <div class="tab" data-t="usage" onclick="go('usage')">调用与用量</div>
    <div class="tab" data-t="tasks" onclick="go('tasks')">任务</div>
    <div class="tab" data-t="audit" onclick="go('audit')">审计</div>
  </div>

  <div id="page"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const adminKey = () => $("#k").value.trim();
const fmt = n => (n == null ? "—" : Number(n).toLocaleString("zh-CN"));
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dot = ok => `<span class="dot ${ok ? 'on' : 'off'}"></span>${ok ? '正常' : '异常'}`;
let TAB = (location.hash || "").replace("#", "") || "overview";
if (!["overview", "keys", "usage", "tasks", "audit"].includes(TAB)) TAB = "overview";

async function api(path, opts = {}) {
  const sep = path.includes("?") ? "&" : "?";
  const _k = encodeURIComponent(adminKey());
  const r = await fetch(path + sep + "admin_key=" + _k + "&key=" + _k, {
    cache: "no-store", ...opts,
    headers: {"Content-Type": "application/json", ...(opts.headers || {})}
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail ? JSON.stringify(j.detail) : ("HTTP " + r.status));
  return j;
}

function go(t) {
  TAB = t;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t === t));
  location.hash = t;
  reload();
}

async function reload() {
  $("#msg").textContent = "加载中…";
  try {
    if (TAB === "overview") await renderOverview();
    else if (TAB === "keys") await renderKeys();
    else if (TAB === "usage") await renderUsage();
    else if (TAB === "tasks") await renderTasks();
    else if (TAB === "audit") await renderAudit();
    $("#msg").textContent = "";
  } catch (e) {
    var m = String(e.message || e);
    if (m.indexOf("401") >= 0 || m.indexOf("无效") >= 0) {
      m += "（这是管理 key 校验：请用 QZ_ADMIN_KEY 配置的管理 key，不是用户 key）";
    }
    $("#msg").textContent = "失败：" + m;
  }
}

async function renderOverview() {
  const d = await api("/api/admin/overview");
  const lib = d.lib || {}, svc = d.services || {}, u = d.usage || {}, k = d.keys || {};
  const today = u.today || {};
  const errRate = today.n ? ((today.err || 0) / today.n * 100).toFixed(1) : "0.0";
  const cov = lib.coverage_by_year || [];
  const sc = d.scope || {};
  const isSuper = sc.role === "super";
  const who = isSuper ? "平台管理员" : ("租户：" + (sc.tenant || "-") + " · 单位管理员");
  $("#who").textContent = who;
  // 租户管理员：隐藏平台级 tab
  document.querySelectorAll('.tab').forEach(function (t) {
    if (!isSuper && ["tasks", "audit"].indexOf(t.dataset.t) >= 0) t.style.display = "none";
    else t.style.display = "";
  });
  if (!isSuper && ["tasks", "audit"].indexOf(TAB) >= 0) { TAB = "overview"; }
  const tn = d.tenant;
  const tblock = (!isSuper && tn) ? `
    <div class="panel" style="margin-top:12px">
      <h3>本单位额度</h3>
      <table><tbody>
        <tr><td>单位</td><td style="text-align:right"><b>${esc(tn.name)}</b></td></tr>
        <tr><td>每日总配额</td><td style="text-align:right">${tn.quota_daily ? fmt(tn.quota_daily) : "不限"}</td></tr>
        <tr><td>今日已用</td><td style="text-align:right">${fmt(tn.today)}</td></tr>
        <tr><td>状态</td><td style="text-align:right">${tn.enabled ? '<span class="pill ok">正常</span>' : '<span class="pill bad">已停用</span>'}</td></tr>
      </tbody></table>
    </div>` : "";
  $("#page").innerHTML = `
    <div class="grid g4">
      ${[["论文", fmt(lib.papers), "去重 " + fmt(lib.unique_papers)],
         ["全文", fmt(lib.fulltext), "覆盖见下方"],
         ["引用关系", fmt(lib.refs), "用于漏引检测"],
         ["评审问题线索", fmt(lib.issues), "从真实评审抽取"]]
        .map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("")}
    </div>
    <div class="grid g4" style="margin-top:12px">
      ${[["今日请求", fmt(today.n), "近 7 天见「用量」"],
         ["错误率", errRate + "%", "5xx 占比"],
         ["平均耗时", (today.avg_ms || 0) + " ms", "全接口"],
         ["Key", fmt(k.n), `活跃 ${k.active_today || 0}｜停用 ${k.disabled || 0}`]]
        .map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("")}
    </div>

    <div class="grid g2" style="margin-top:14px">
      <div class="panel">
        <h3>服务健康</h3>
        <table><tbody>
          ${[["网关 5020", svc.gateway], ["v18 引擎 18097", svc.v18], ["重排服务 18098", svc.rerank],
             ["云端 DSH 3080", svc.dsh], ["nginx 443/8443", svc.nginx]]
            .map(([n, v]) => `<tr><td>${n}</td><td style="text-align:right">${dot(v === 200)}</td></tr>`).join("")}
        </tbody></table>
        <div class="muted" style="margin-top:8px">快照：${esc(d.at || "")}</div>
      </div>
      <div class="panel">
        <h3>库覆盖（按年）</h3>
        <table><thead><tr><th>年份</th><th>全文</th><th>论文</th><th>覆盖率</th></tr></thead><tbody>
        ${cov.map(c => `<tr><td>${c.year}</td><td>${fmt(c.fulltext)}</td><td>${fmt(c.papers)}</td>
          <td><span class="pill ${c.rate >= 95 ? 'ok' : ''}">${c.rate == null ? "—" : c.rate + "%"}</span></td></tr>`).join("")}
        </tbody></table>
      </div>
    </div>
    ${tblock}`;
}

async function renderKeys() {
  const d = await api("/api/admin/keys");
  const rows = d.keys || [];
  $("#page").innerHTML = `
    <div class="panel">
      <h3>新建 key</h3>
      <div class="form">
        <div><label>用途名称</label><input id="f-name" placeholder="如：学校智能体平台"></div>
        <div id="roleWrap"><label>角色</label><select id="f-role"><option value="user">user</option><option value="admin">admin</option></select></div>
        <div><label>每日配额（0=不限）</label><input id="f-quota" type="number" value="0"></div>
        <div><button class="btn primary" onclick="createKey()">生成</button></div>
      </div>
      <div id="newkey"></div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h3>Key 列表 <span class="muted">共 ${rows.length} 个</span></h3>
      <table><thead><tr><th>用途</th><th>前缀</th><th>角色</th><th>状态</th><th>今日</th><th>累计</th><th>最近使用</th><th></th></tr></thead><tbody>
      ${rows.map(k => `<tr>
        <td><b>${esc(k.name)}</b></td>
        <td><code>${esc(k.prefix)}…</code></td>
        <td>${esc(k.role)}</td>
        <td>${k.enabled ? '<span class="pill ok">启用</span>' : '<span class="pill bad">停用</span>'}</td>
        <td>${fmt(k.today_calls)}</td>
        <td>${fmt(k.total_calls)}</td>
        <td class="muted">${esc(k.last_used || "—")}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn sm" onclick="toggleKey(${k.id}, ${k.enabled ? "false" : "true"})">${k.enabled ? "停用" : "启用"}</button>
          <button class="btn sm danger" onclick="delKey(${k.id}, '${esc(k.name)}')">删除</button>
        </td></tr>`).join("") || '<tr><td colspan="8" class="muted">还没有 key</td></tr>'}
      </tbody></table>
      <div class="muted" style="margin-top:10px">调用方式：请求头 <code>X-Api-Key: &lt;key&gt;</code> 或 <code>X-QunZhi-Key</code>。</div>
    </div>`;
}

async function createKey() {
  const name = $("#f-name").value.trim();
  if (!name) { alert("请填用途名称"); return; }
  const j = await api("/api/admin/keys", {
    method: "POST",
    body: JSON.stringify({name,
      role: ($("#f-role") ? $("#f-role").value : "user"),
      quota_daily: parseInt($("#f-quota").value || "0")})
  });
  const box = $("#newkey");
  box.style.display = "block";
  box.innerHTML = `<b>新 key（只显示这一次，请立即复制）</b><br>
    <code>${esc(j.key)}</code>
    <div class="muted" style="margin-top:6px">用途：${esc(j.name)}　角色：${esc(j.role)}　配额：${j.quota_daily || "不限"}</div>`;
  renderKeys();
}

async function toggleKey(id, enabled) {
  await api(`/api/admin/keys/${id}/toggle`, {method: "POST", body: JSON.stringify({enabled})});
  renderKeys();
}
async function delKey(id, name) {
  if (!confirm(`删除 key「${name}」？该 key 会立刻失效。`)) return;
  await api(`/api/admin/keys/${id}`, {method: "DELETE"});
  renderKeys();
}

async function renderUsage() {
  const d = await api("/api/admin/usage?days=7");
  const s = d.summary || {}, days = s.days || [], t = s.today || {};
  const max = Math.max(1, ...days.map(x => x.n || 0));
  const errRate = t.n ? ((t.err5 || 0) / t.n * 100).toFixed(1) : "0.0";
  $("#page").innerHTML = `
    <div class="grid g4">
      ${[["今日请求", fmt(t.n)], ["5xx 错误", fmt(t.err5)], ["错误率(5xx)", errRate + "%"],
         ["未授权(401/403)", fmt(t.auth)]]
        .map(([l, v]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}
    </div>
    <div class="muted" style="margin-top:8px">平均耗时 ${(t.avg_ms || 0)} ms｜未授权通常来自扫描器或缺 key 的调用，不计入错误率</div>

    <div class="grid g2" style="margin-top:14px">
      <div class="panel">
        <h3>近 7 天请求量</h3>
        <div class="bars">
          ${days.map(x => `<div class="b" title="${x.day}: ${x.n}">
            <div class="bn">${x.n}</div><div class="bx" style="height:${Math.max(4, Math.round((x.n / max) * 80))}px"></div>
            <div class="bl">${String(x.day).slice(5)}</div></div>`).join("") || '<div class="muted">暂无数据</div>'}
        </div>
      </div>
      <div class="panel">
        <h3>按接口（近 7 天）</h3>
        <table><tbody>
        ${(s.by_path || []).map(p => `<tr><td><code>${esc(p.path)}</code></td>
          <td style="text-align:right">${fmt(p.n)} 次</td>
          <td style="text-align:right" class="muted">${p.avg_ms} ms</td>
          <td style="text-align:right">${p.err5 ? `<span class="pill bad">${p.err5} 个 5xx</span>` : ""} ${p.auth ? `<span class="pill">${p.auth} 未授权</span>` : ""}</td></tr>`).join("") || '<tr><td class="muted">暂无</td></tr>'}
        </tbody></table>
      </div>
    </div>

    <div class="panel" style="margin-top:14px">
      <h3>最近调用（50 条）</h3>
      <table><thead><tr><th>时间</th><th>Key</th><th>方法</th><th>路径</th><th>状态</th><th>耗时</th><th>IP</th></tr></thead><tbody>
      ${(d.recent || []).map(r => `<tr>
        <td class="muted">${esc(r.ts)}</td><td>${esc(r.key_name)}</td>
        <td>${esc(r.method)}</td><td><code>${esc(r.path)}</code></td>
        <td>${r.status >= 400 ? `<span class="pill bad">${r.status}</span>` : `<span class="pill ok">${r.status}</span>`}</td>
        <td>${r.ms} ms</td><td class="muted">${esc(r.ip)}</td></tr>`).join("") || '<tr><td colspan="7" class="muted">暂无记录</td></tr>'}
      </tbody></table>
    </div>`;
}

async function renderTasks() {
  const d = await api("/api/admin/tasks?limit=30");
  $("#page").innerHTML = `
    <div class="panel">
      <h3>论文包任务 <span class="muted">共 ${(d.tasks || []).length} 个</span></h3>
      <table><thead><tr><th>job</th><th>包名</th><th>文件</th><th>时间</th><th></th></tr></thead><tbody>
      ${(d.tasks || []).map(t => `<tr>
        <td><code>${esc(t.job)}</code></td><td>${esc(t.zip || "")}</td><td>${t.files ?? ""}</td>
        <td class="muted">${esc(t.at || "")}</td>
        <td style="text-align:right;white-space:nowrap">
          <a class="btn sm" href="${esc(t.url)}" target="_blank">报告</a>
          <button class="btn sm danger" onclick="delTask('${esc(t.job)}')">删除</button>
        </td></tr>`).join("") || '<tr><td colspan="5" class="muted">暂无任务</td></tr>'}
      </tbody></table>
    </div>`;
}

async function delTask(job) {
  if (!confirm(`删除任务 ${job} 及其报告？`)) return;
  await api(`/api/admin/tasks/${encodeURIComponent(job)}`, {method: "DELETE"});
  renderTasks();
}

async function renderAudit() {
  const d = await api("/api/admin/audit");
  $("#page").innerHTML = `
    <div class="panel">
      <h3>管理操作审计</h3>
      <table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>详情</th></tr></thead><tbody>
      ${(d.items || []).map(a => `<tr><td class="muted">${esc(a.ts)}</td><td>${esc(a.actor)}</td>
        <td><code>${esc(a.action)}</code></td><td class="muted">${esc(a.detail)}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">暂无记录</td></tr>'}
      </tbody></table>
    </div>`;
}

$("#k").addEventListener("keydown", e => {
  if (e.key === "Enter") { localStorage.setItem("qz_admin_key", adminKey()); reload(); }
});
const _saved = new URLSearchParams(location.search).get("admin_key")
  || localStorage.getItem("qz_admin_key") || "";
if (_saved) { $("#k").value = _saved; reload(); }
else { $("#msg").textContent = "请输入管理 key"; }
</script>
<script src="/static/qz-nav.js"></script>
</body>
</html>
